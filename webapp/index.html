<!doctype html>
<html lang="ru"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<script src="https://telegram.org/js/telegram-web-app.js"></script>

<title>Квест дня</title>
<link rel="preconnect" href="https://fonts.googleapis.com">

<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Russo+One&family=Manrope:wght@500;600;700;800&display=swap">
<style>
/* Один тёмный вид (боевой пропуск): бронза и огонь. Тема намеренно одна. */
:root{
  --bg:#17110e; --panel:#201712; --panel2:#2a1a12; --line:#3a2b22; --line2:#4a3426;
  --fg:#f3e9dd; --muted:#b3a193; --dim:#8e7c6d;
  --gold:#e0a456; --fire:#e5603f; --fire2:#f08a5d; --ok:#6c9a7d; --okl:#7fc79c; --red:#e0705a;
  --paper:#f3e9dd; --ink:#1d1410; --rust:#8a4b1c; --paperline:#e9c3a8;
  --display:"Russo One","Manrope",system-ui,sans-serif;
  --body:"Manrope",system-ui,-apple-system,"Segoe UI",sans-serif;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{background:var(--bg)}
body{color:var(--fg);font:15px/1.45 var(--body);margin:0}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
[hidden]{display:none!important}
.app{max-width:520px;margin:0 auto;padding-bottom:calc(88px + env(safe-area-inset-bottom,0px))}

.appbar{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;display:flex;align-items:center;justify-content:space-between;gap:12px;padding:14px 16px 12px;background:var(--bg)}
.appbar .tt{display:flex;flex-direction:column;min-width:0}
.appbar h1{font-family:var(--display);font-weight:400;font-size:28px;line-height:1.1;margin:0}
.appbar .sub{font-size:13px;font-weight:700;color:var(--muted)}
.appbar .sub::first-letter{text-transform:uppercase}
.pills{display:flex;gap:8px;flex-shrink:0}
.pill{display:flex;align-items:center;gap:6px;height:38px;white-space:nowrap;flex-shrink:0;padding:0 12px;border-radius:19px;background:var(--panel);border:1px solid var(--line2);font-family:var(--display);font-size:16px;color:var(--fg)}
.pill svg{width:18px;height:18px}
.pill.fire{color:#ff8a5c}.pill.gear{padding:0 10px;color:var(--muted)}.pill.gear.on{color:var(--gold);border-color:var(--gold)}.pill.fire.zero{color:var(--dim)}
.pill.navplus{min-width:58px;display:grid;place-items:center;background:none;border:none;padding:0}
.navplus span{width:54px;height:54px;margin-top:-22px;border-radius:50%;background:var(--gold);color:var(--ink);display:grid;place-items:center;box-shadow:0 6px 18px rgba(224,164,86,.3);border:4px solid #1c1511}
.rqlist{display:flex;flex-direction:column;gap:6px}
.rqlist div{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:12px;background:var(--panel);font-weight:700}
.rqlist .c{width:24px;height:24px;border-radius:7px;border:2px solid var(--line2);display:grid;place-items:center;flex-shrink:0}
.rqlist .on .c{background:var(--ok);border-color:var(--ok)}
.rqlist .on{color:var(--dim)}
.confirm{margin:12px 16px 0;padding:14px;border-radius:16px;background:var(--panel2);border:1px solid var(--gold);display:flex;flex-direction:column;gap:10px}
.confirm p{margin:0;font-size:14px;color:#d9c9b9}
.confirm .warn{color:var(--red);font-weight:700}
.btns{display:flex;gap:8px}
.btns button{flex:1;height:46px;border-radius:12px;font-weight:800;border:1px solid var(--line2);background:transparent}
.btns .pri{background:var(--gold);color:var(--ink);border-color:var(--gold)}

.daybar{margin:0 16px 14px;display:flex;flex-direction:column;gap:6px}
.track{display:flex;height:12px;border-radius:6px;overflow:hidden;background:var(--line)}
.track i{display:block;height:100%;border-right:2px solid var(--bg)}
.track .t{background:#5a4131}.track .v{background:var(--fire)}.track .g{background:var(--gold)}.track .f{background:#2f4a3b}.track .o{background:var(--red)}.track .a{background:#3a2b22}
.dline{display:flex;justify-content:space-between;gap:8px;font-size:13px;font-weight:700;color:var(--muted)}
.dline b{color:var(--fg);font-variant-numeric:tabular-nums}
.dline .free b{color:var(--okl)}.dline .minus b{color:var(--red)}
.plus{width:48px;height:48px;border-radius:50%;border:none;background:var(--gold);color:var(--ink);display:grid;place-items:center;flex-shrink:0;box-shadow:0 4px 16px rgba(224,164,86,.25)}
/* окошки добавления */
.sheet{position:fixed;inset:0;z-index:25;display:flex;flex-direction:column;justify-content:flex-end;background:rgba(10,7,5,.6)}
.sheet .pnl{background:var(--panel2);border-radius:22px 22px 0 0;border-top:1px solid var(--line2);padding:16px 16px calc(20px + env(safe-area-inset-bottom,0px));max-width:520px;width:100%;margin:0 auto;display:flex;flex-direction:column;gap:14px;max-height:88vh;overflow-y:auto}
.sheet .sbar{display:flex;align-items:center;justify-content:space-between;gap:8px}
.sheet .dots{display:flex;gap:6px}
.sheet .dots i{width:22px;height:5px;border-radius:3px;background:var(--line2)}
.sheet .dots i.on{background:var(--gold)}
.sheet h2{font-family:var(--display);font-weight:400;font-size:22px;margin:0}
.sheet .q{font-size:14px;color:var(--muted);margin:-8px 0 0}
.sheet input{height:52px;border-radius:14px;border:1px solid var(--line2);background:var(--bg);padding:0 14px;color:var(--fg);font-size:17px;width:100%}
.opts{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.opts.three{grid-template-columns:repeat(3,minmax(0,1fr))}
.opts.four{grid-template-columns:repeat(4,minmax(0,1fr))}.opts.four .opt{height:44px;font-size:14px}
.rl{margin:2px 0 0;font-size:13px;font-weight:800;color:var(--muted);display:flex;justify-content:space-between}.rl span{font-weight:700;color:var(--dim)}
.rhint{margin:0;font-size:12.5px;color:var(--dim);font-weight:600}
.rgoal{margin:-4px 0 4px;font-size:13px;font-weight:800;color:var(--gold)}
.rdays{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:5px}.rdays .chip{padding:8px 0;text-align:center;justify-content:center;color:var(--dim)}
[data-sort]>[data-sid]{-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;transition:transform .16s ease}
[data-sort]>[data-sid].drag{position:relative;z-index:5;transition:none;background:var(--panel2);box-shadow:0 12px 28px rgba(0,0,0,.5);border-radius:14px}
body.dragging{overscroll-behavior:none}
.chk.play{border-color:var(--gold);color:var(--gold)}.chk.play svg{width:14px;height:14px;margin-left:2px}
.rdays .chip[aria-pressed="true"]{background:#1f2a20;border-color:var(--okl);color:var(--okl)}
.opts.rtwo{grid-template-columns:1fr 1fr}.rtpick{position:relative;display:grid;place-items:center;cursor:pointer}.rtpick input{position:absolute;inset:0;width:100%;height:100%;opacity:0;cursor:pointer;border:none}
.rsteps{display:flex;flex-direction:column;gap:4px;font-size:13px;color:var(--muted);font-weight:600}
.opt{min-height:52px;border-radius:14px;border:1px solid var(--line2);background:var(--panel);font-weight:700;font-size:15px;padding:8px;text-align:center}
.opt small{display:block;font-size:12px;font-weight:600;color:var(--muted)}
.opt[aria-pressed="true"]{border-color:var(--gold);background:#3a2416;color:var(--gold)}
.menu{display:flex;flex-direction:column;gap:8px}
.menu .opt{display:flex;align-items:center;gap:12px;text-align:left;padding:12px 14px}

.now{margin:0 16px;padding:18px 16px;border-radius:22px;background:var(--paper);color:var(--ink);display:flex;flex-direction:column;gap:12px}
.now .k{display:flex;justify-content:space-between;gap:8px;font-size:13px;font-weight:800;color:var(--rust)}
.now h2{font-family:var(--display);font-weight:400;font-size:26px;line-height:1.1;margin:0}
.now p{margin:4px 0 0;font-size:14px;color:#5a4436}
.clock{display:flex;align-items:baseline;gap:10px}
.clock b{font-family:var(--display);font-weight:400;font-size:40px;line-height:1;font-variant-numeric:tabular-nums}
.clock span{font-size:14px;font-weight:700;color:#5a4436}
.now.late{background:#f6ddd3}.now.late .clock b,.now.late .k{color:#b0391f}
.now.free{background:var(--panel);color:var(--fg);border:1px solid var(--line2)}
.now.free .k{color:var(--gold)}.now.free p{color:var(--muted)}
.segs{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:4px}
.seg{height:6px;border-radius:3px;background:var(--paperline)}.seg.on{background:var(--fire)}
.bigbtn{height:56px;border:none;border-radius:16px;background:var(--ink);color:var(--paper);font-weight:800;font-size:17px;display:flex;align-items:center;justify-content:center;gap:10px;width:100%}
.ghost{height:46px;border-radius:14px;background:transparent;border:1px solid #cdb39c;color:var(--ink);font-weight:700;font-size:15px;width:100%}
.now.free .ghost{border-color:var(--line2);color:var(--fg)}


.sec{display:flex;justify-content:space-between;align-items:baseline;padding:14px 20px 6px}
.sec h3{margin:0;font-size:15px;font-weight:800}
.sec.spo{width:calc(100% - 32px);margin:8px 16px 0;padding:14px;border-radius:14px;background:var(--panel);border:none;color:var(--fg);font:inherit;text-align:left}
.glist{display:flex;flex-direction:column;gap:10px;padding:0 16px}
.gcard{border:none;border-radius:18px;background:var(--panel);padding:14px;text-align:left;color:var(--fg);font:inherit;display:flex;flex-direction:column;gap:2px}
.gcard .gh{display:flex;align-items:center;gap:10px}.gcard .gh i{font-style:normal;font-size:20px;width:40px;height:40px;border-radius:12px;background:var(--panel2);display:grid;place-items:center}
.gcard .gh b{font-size:16px;flex:1}.chev{width:8px;height:8px;border-right:2px solid var(--dim);border-top:2px solid var(--dim);transform:rotate(45deg);margin-right:4px}
.gcnum{display:flex;align-items:baseline;gap:8px;margin-top:10px;flex-wrap:wrap}.gcnum b{font-family:var(--display);font-weight:400;font-size:28px}.gcnum span{color:var(--muted);font-size:13px;font-weight:700}
.gbar{height:8px;border-radius:4px;background:var(--line);margin-top:6px;overflow:hidden}.gbar i{display:block;height:100%;background:var(--fire);border-radius:4px}
.gwins{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;margin-top:10px}.gwins i{height:14px;border-radius:5px;background:var(--panel2)}.gwins i.on{background:var(--fire)}.gwins i.off{opacity:.35}
.gl2{display:flex;justify-content:space-between;gap:8px;margin-top:10px;padding-top:10px;border-top:1px solid var(--line);font-size:13px;font-weight:700;color:var(--muted)}
.firstgoal{margin:8px 16px 0;padding:18px 16px;border-radius:22px;background:var(--paper);color:var(--ink);display:flex;flex-direction:column;gap:8px}
.firstgoal b{font-family:var(--display);font-weight:400;font-size:22px}.firstgoal p{margin:0 0 6px;color:#5a4436}
.addmod{width:100%;height:50px;border-radius:14px;border:1.5px dashed var(--line2);background:transparent;color:var(--gold);font:inherit;font-weight:800;font-size:15px}
.card .mh{display:flex;justify-content:space-between;align-items:baseline;gap:8px}.card .mh span{font-size:13px;font-weight:700;color:var(--muted)}
.gload{display:flex;gap:8px;justify-content:center;padding:24px 0}.gload i{width:10px;height:10px;border-radius:50%;background:var(--gold);animation:gl 1s infinite alternate}.gload i:nth-child(2){animation-delay:.2s}.gload i:nth-child(3){animation-delay:.4s}
@keyframes gl{from{opacity:.25;transform:translateY(0)}to{opacity:1;transform:translateY(-6px)}}
.gund{margin:0 0 6px;color:var(--gold);font-weight:800;font-size:13px}
.gqa{border-radius:14px;background:var(--panel);padding:12px;display:flex;flex-direction:column;gap:8px}.gqa b{font-size:15px}
.ghdr{border-radius:16px;background:linear-gradient(135deg,#2c1a12,#201712);border:1px solid var(--line2);padding:12px 14px;margin-bottom:6px}.ghdr b{font-family:var(--display);font-weight:400;font-size:20px;display:block}.ghdr small{color:var(--muted);font-weight:700;font-size:12px}
.gsec{font-size:12px;font-weight:800;color:var(--gold);margin:12px 0 6px;letter-spacing:.04em}
.gwarn{border-radius:12px;background:#3a1d14;color:#ffb39a;padding:10px 12px;font-size:13px;font-weight:700;margin-top:8px}
.btns{display:flex;gap:8px}.btns>*{flex:1}
.dangerbtn{height:50px;border-radius:14px;border:none;background:var(--red);color:#fff;font:inherit;font-weight:800;font-size:15px;width:100%}
#sheet textarea{width:100%;font:inherit;font-size:16px;color:var(--fg);background:var(--panel);border:1.5px solid var(--gold);border-radius:14px;padding:12px;resize:vertical}
#onb{position:fixed;inset:0;z-index:200;background:var(--bg);overflow:auto}
.onbw{min-height:100%;padding:90px 22px 110px;background:radial-gradient(120% 70% at 50% 0%,#3a1d10 0%,var(--bg) 60%);text-align:center}
.onblogo{width:76px;height:76px;border-radius:24px;background:var(--fire);display:grid;place-items:center;font-size:40px;margin:0 auto 18px;box-shadow:0 10px 40px rgba(232,100,63,.35)}
.onbw h2{font-family:var(--display);font-weight:400;font-size:34px;margin:0 0 10px}.onbw p{color:var(--muted);font-size:16px;line-height:1.45;margin:0 0 24px}
.onbf{display:flex;flex-direction:column;gap:12px;text-align:left;max-width:300px;margin:0 auto}.onbf div{display:flex;gap:12px;align-items:center;font-weight:700}.onbf i{font-style:normal;width:38px;height:38px;border-radius:12px;background:var(--panel);display:grid;place-items:center}
.onbgo{position:fixed;left:16px;right:16px;bottom:calc(20px + env(safe-area-inset-bottom,0px));height:56px;border:none;border-radius:16px;background:var(--gold);color:var(--ink);font:inherit;font-weight:800;font-size:17px;max-width:488px;margin:0 auto}
.onbs{padding:40px 18px 110px;max-width:520px;margin:0 auto}.onbn{color:var(--gold);font-weight:800;font-size:12px;letter-spacing:.06em}
.onbs h3{font-family:var(--display);font-weight:400;font-size:30px;line-height:1.1;margin:10px 0 8px}.onbs p{color:var(--muted);font-size:15px;margin:0 0 24px}
#onbname{width:100%;height:60px;border-radius:16px;border:1.5px solid var(--gold);background:transparent;color:var(--fg);font:inherit;font-size:20px;padding:0 16px}
.onbt{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:16px}.onbt label{border-radius:18px;background:var(--panel);padding:14px;text-align:center;display:flex;flex-direction:column;align-items:center;gap:4px}
.onbt i{font-style:normal;font-size:22px}.onbt small{color:var(--muted);font-weight:700}.onbt input{background:transparent;border:none;color:var(--fg);font-family:var(--display);font-size:28px;text-align:center;width:100%;color-scheme:dark}
.onbbar{height:14px;border-radius:7px;background:var(--panel2);position:relative;overflow:hidden}.onbbar i{position:absolute;top:0;bottom:0;background:linear-gradient(90deg,var(--gold),var(--fire))}
.onbdl{display:flex;justify-content:space-between;color:var(--dim);font-size:11px;font-weight:700;margin-top:4px}
.onbnote{margin-top:16px;border-radius:14px;background:var(--panel);padding:12px;color:var(--muted);font-size:14px;font-weight:600}
.sec.spo h3{white-space:nowrap}.sec.spo span{white-space:nowrap;font-size:13px;font-weight:700;color:var(--muted)}
.spol{margin-top:6px}
.sec span,.sec button{font-size:13px;font-weight:700;color:var(--muted);background:none;border:none;padding:0}
.sec button{color:var(--gold);padding:6px 0 6px 12px;margin:-6px 0}
.list{display:flex;flex-direction:column;gap:6px;padding:0 16px}
nav.tabs .ico{position:relative;display:grid}
.badge{position:absolute;top:-6px;right:-10px;min-width:18px;height:18px;padding:0 5px;border-radius:9px;background:var(--red);color:#fff;font-style:normal;font-size:11px;font-weight:800;line-height:18px;text-align:center}
.hrow{display:flex;align-items:center;gap:10px;padding:8px 12px;border-radius:14px;background:var(--panel);min-height:46px}
.list:has(>.hrow){gap:0}
.list>.hrow{border-radius:0}.list>.hrow+.hrow{border-top:1px solid var(--line)}
.list>.hrow:first-child{border-top-left-radius:14px;border-top-right-radius:14px}.list>.hrow:last-child{border-bottom-left-radius:14px;border-bottom-right-radius:14px}
button.hrow{width:100%;border:none;color:inherit;font:inherit;text-align:left}
.go::after{content:"";width:8px;height:8px;border-right:2px solid var(--dim);border-top:2px solid var(--dim);transform:rotate(45deg);flex-shrink:0;margin:0 4px 0 2px}
.hrow .val{font-size:13px;font-weight:700;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:45%}
.sw{width:46px;height:28px;border-radius:14px;border:none;background:var(--line2);position:relative;flex-shrink:0;padding:0}
.sw::after{content:"";position:absolute;top:3px;left:3px;width:22px;height:22px;border-radius:50%;background:var(--muted);transition:left .15s}
.sw[aria-pressed="true"]{background:var(--ok)}.sw[aria-pressed="true"]::after{left:21px;background:#fff}
.subh{display:flex;align-items:center;gap:10px;padding:2px 16px 8px}
.subh h2{margin:0;font-size:20px;font-weight:800}
.subh .bk{width:40px;height:40px;border-radius:12px;border:1px solid var(--line2);background:var(--panel);color:var(--fg);display:grid;place-items:center;flex-shrink:0}
.glabel{padding:14px 20px 6px;font-size:15px;font-weight:800;color:var(--fg)}
.hrow .nm{flex:1;min-width:0;display:flex;flex-direction:column}
.hrow .nm b{font-size:15px;font-weight:700;overflow-wrap:anywhere}.hrow .nm small{font-size:12px;font-weight:700;color:var(--muted)}
.hrow .nm small.bad{color:var(--red)}
.hrow .chk{width:30px;height:30px;flex-shrink:0;border-radius:9px;border:2px solid var(--line2);background:transparent;display:grid;place-items:center}
.hrow .chk.on{background:var(--ok);border-color:var(--ok)}
.hrow select,.mini select{background:var(--panel2);color:var(--fg);border:1px solid var(--line2);border-radius:10px;height:34px;padding:0 8px;font:inherit;font-weight:700}
.add select{flex:1;background:var(--panel2);color:var(--fg);border:1px solid var(--line2);border-radius:12px;height:44px;padding:0 10px;font:inherit}
.lvl{height:30px;padding:0 10px;border-radius:15px;border:1px solid var(--line2);background:transparent;font-size:12px;font-weight:800;color:var(--okl);flex-shrink:0}
.lvl.low{color:var(--gold);border-color:#6b5230}.lvl.out{color:var(--red);border-color:#6b3328}
.cats{display:flex;gap:6px;flex-wrap:wrap}
.cats .chip[aria-pressed="true"]{background:var(--panel2);border-color:var(--gold);color:var(--fg)}
.perm{display:flex;flex-wrap:wrap;gap:6px}
.perm .chip{font-size:12px;min-height:30px;padding:4px 8px}
.perm .chip[aria-pressed="true"]{border-color:var(--okl);color:var(--okl)}
.idea{display:flex;flex-direction:column;gap:4px;padding:10px 12px;border-radius:14px;background:var(--panel2)}
.row{display:flex;align-items:center;gap:12px;padding:10px 12px;border-radius:14px;background:var(--panel);border:1px solid transparent;text-align:left;width:100%;min-height:54px}
.row .tm{width:50px;flex-shrink:0;display:flex;flex-direction:column;font-size:13px;font-weight:800;font-variant-numeric:tabular-nums;line-height:1.2}
.row .tm small{font-size:11px;font-weight:600;color:var(--dim)}
.row .nm{flex:1;min-width:0;display:flex;flex-direction:column}
.row .nm b{font-size:15px;font-weight:700}
.row .nm small{font-size:12px;color:var(--muted)}
.row .chk{width:30px;height:30px;flex-shrink:0;border-radius:9px;border:2px solid var(--line2);background:transparent;display:grid;place-items:center;padding:0}
.rowmain{flex:1;min-width:0;display:flex;align-items:center;gap:10px;background:none;border:none;padding:4px 0;text-align:left;color:inherit;min-height:44px}
.row.cur{border-color:var(--gold)}
.row .x{width:32px;height:32px}
.row.on{opacity:.7}.row.on .chk{background:var(--ok);border-color:var(--ok)}
.row.on .nm b{color:var(--dim);text-decoration:line-through}
.row.boss{background:var(--panel2);border-color:var(--fire)}
.row.game{background:#2a2014;border-color:var(--gold)}
.row.anchor{border-color:var(--line2)}
.row.gap{background:transparent;border:1px dashed var(--line);min-height:40px;padding:8px 12px}

    out[id]={min:Math.max(5,Math.round(median(ok)/5)*5),n:ok.length}}
  _learnKey=sig;_learn=out;return out;
}

/* ---------- живой план ---------- */
// Раскладывает несделанное от «сейчас»: якоря стоят на месте, остальное обтекает их.
function plan(k,extraGame){
  const d=dayOf(k),now=nowMin(),out=[],over=[];
  const w0=d.at.wake||d.woke;
  const start=w0?Math.min(now,toMin(w0)):Math.max(now,toMin(DAY_START_()));
  let cur=Math.max(now,start);
  // идущий отдых
  const rests=restsOf(d).map(r=>({s:toMin(r.at),m:r.min})).filter(r=>r.s+r.m>now).sort((a,b)=>a.s-b.s);
  if(extraGame)rests.push({s:Math.max(now,rests.length?rests[rests.length-1].s+rests[rests.length-1].m:now),m:extraGame});
  for(const r of rests){const s=r.s<=now?r.s:Math.max(r.s,cur);out.push({game:1,start:s,end:s+r.m,now:s<=now});cur=Math.max(cur,s+r.m)}
  const pending=queue(k).filter(q=>!isDone(d,q));
  // начатое дело идёт первым
  const ci=d.cur&&pending.findIndex(q=>q.id===d.cur.id);
  if(ci>=0){const q=pending.splice(ci,1)[0];const s=toMin(d.cur.at);const e=s+durOf(d,q);out.push({q,start:s,end:Math.max(e,now+5),pe:e,started:1,late:now>e?now-e:0,now:1});cur=Math.max(cur,Math.max(e,now+5))}
  const anchors=pending.filter(q=>q.fixed).sort((a,b)=>toMin(a.fixed)-toMin(b.fixed));
  const flex=pending.filter(q=>!q.fixed),ord=d.ord||[];
  if(ord.length){const pos=new Map(ord.map((x,i)=>[x,i])),P_=x=>pos.has(x.id)?pos.get(x.id):1e4;flex.sort((a,b)=>P_(a)-P_(b))}
  const end=toMin(DAY_END_());
  const placeAnchor=a=>{const s=Math.max(toMin(a.fixed),cur);if(toMin(a.fixed)>cur&&toMin(a.fixed)-cur>=10)out.push({gap:1,start:cur,end:toMin(a.fixed)});out.push({q:a,start:s,end:s+durOf(d,a),anchor:1,late:Math.max(0,cur-toMin(a.fixed))});cur=s+durOf(d,a)};
  for(const q of flex){
    const du=durOf(d,q);
    while(anchors.length&&toMin(anchors[0].fixed)<cur+du&&anchors[0].fixed!==DAY_END_())placeAnchor(anchors.shift());
    if(cur+du>end){if(!q.opt||q.penalty)over.push({q,dur:du});continue} // бонусы молча не влезают
    out.push({q,start:cur,end:cur+du});cur+=du;
  }
  while(anchors.length)placeAnchor(anchors.shift());
  if(out.length&&!out[0].now&&out[0].start<=now+1)out[0].now=1;
  return {items:out,over};
}

let DRAG=null,dragEnd=0;
function sortDrop(kind,ids){
  const place=(all,get)=>{const slots=[];all.forEach((x,i)=>{if(ids.includes(get(x)))slots.push(i)});const by=new Map(all.map(x=>[get(x),x])),out=all.slice();slots.forEach((si,n)=>{out[si]=by.get(ids[n])});return out};
  if(kind==="today"){const k=key(),d=dayOf(k),all=plan(k).items.filter(x=>x.q&&!x.started&&!x.anchor).map(x=>x.q.id);d.ord=place(all,x=>x)}
  else if(kind==="routine"){setProf({routine:place(prof().routine,x=>x.id)})}
  save();
}
function dragBegin(row,y){
  const list=row.parentElement,items=[...list.children].filter(c=>c.dataset.sid),idx=items.indexOf(row);
  if(items.length<2)return;
  const rects=items.map(c=>c.getBoundingClientRect());
  const h=idx<items.length-1?rects[idx+1].top-rects[idx].top:rects[idx].top-rects[idx-1].top;
  DRAG={kind:list.dataset.sort,list,row,items,rects,idx,to:idx,y0:y,h};
  row.classList.add("drag");document.body.classList.add("dragging");
  try{Telegram.WebApp.HapticFeedback.impactOccurred("medium")}catch(e){}
}
function dragMove(y){
  const D=DRAG,dy=y-D.y0,mid=D.rects[D.idx].top+D.rects[D.idx].height/2+dy;
  D.row.style.transform=`translateY(${dy}px)`;
  let to=D.idx;
  D.rects.forEach((r,i)=>{const c=r.top+r.height/2;if(i>D.idx&&mid>c)to=i;if(i<D.idx&&mid<c&&i<to)to=i});
  if(to!==D.to){D.to=to;try{Telegram.WebApp.HapticFeedback.selectionChanged()}catch(e){}}
  D.items.forEach((c,i)=>{if(i===D.idx)return;c.style.transform=i>D.idx&&i<=to?`translateY(${-D.h}px)`:i<D.idx&&i>=to?`translateY(${D.h}px)`:""});
}
function dragFinish(cancel){
  const D=DRAG;if(!D)return;DRAG=null;dragEnd=Date.now();
  D.items.forEach(c=>{c.style.transform=""});D.row.classList.remove("drag");document.body.classList.remove("dragging");
  if(!cancel&&D.to!==D.idx){const ids=D.items.map(c=>c.dataset.sid),[m]=ids.splice(D.idx,1);ids.splice(D.to,0,m);sortDrop(D.kind,ids)}
  render();
}
(function(){

  document.addEventListener("touchstart",e=>{if(e.touches.length===1)down(e,e.touches[0].clientX,e.touches[0].clientY);else stop()},{passive:true});
  document.addEventListener("touchmove",e=>mv(e,e.touches[0].clientX,e.touches[0].clientY),{passive:false});
  document.addEventListener("touchend",()=>{stop();if(DRAG)dragFinish()});
  document.addEventListener("touchcancel",()=>{stop();if(DRAG)dragFinish(true)});
  document.addEventListener("mousedown",e=>{if(e.button===0&&!("ontouchstart" in window))down(e,e.clientX,e.clientY)});
  document.addEventListener("mousemove",e=>mv(e,e.clientX,e.clientY));

  document.addEventListener("contextmenu",e=>{if(e.target.closest("[data-sort] [data-sid]"))e.preventDefault()});

})();

function wNext(){

$("sheet").addEventListener("click",e=>{
  if(e.target===$("sheet")){closeSheet();return}
  const b=e.target.closest("[data-w]");if(!b)return;e.stopPropagation();const a=b.dataset.w;
  if(a==="close")return closeSheet();
  const H=houseOf(),nmV=()=>{const i=$("sheet").querySelector("input[name=v]");return i?i.value.trim():""};
  if(a.startsWith("mvto:")){W.to=a.slice(5);return renderSheet()}
  if(a==="mvgo"){const id=W.id,hs=W.house,nm0=W.name,to=hs?shift(key(),1):W.to,d=dayOf(key());closeSheet();
    if(hs){mutate(()=>{if(!d.skip.includes(id))d.skip.push(id);d.moved=Object.assign({},d.moved,{[id]:{to,n:nm0}});logEv(d,"move",id)});toast("Сегодня убрал, завтра снова в плане");return}
    let nm="";mutate(()=>{nm=moveTask(id,to)});toast(nm?"Перенёс на "+ddmm(to)+". План пересчитан":"Это дело не переносится");return}
  if(a.startsWith("cdur:")){cKeep();W.c.dur=+a.slice(5);return renderSheet()}
  if(a==="ctm:"){cKeep();delete W.c.at;return renderSheet()}
  if(a==="cemv"){const c=W.c;W={step:"mv",id:c.id,name:c.name,to:shift(key(),1),house:!!W.house};return renderSheet()}
  if(a==="cert"){const id=W.id;closeSheet();openRoutine(id);return}
  if(a==="cesave"){cKeep();const c=W.c,B=W.base,cu=W.custom;if(!c.name){toast("Впиши название");return}const d=dayOf(key());closeSheet();
    if(cu){const x=d.custom.find(y=>y.id===c.id);if(x){x.name=c.name;x.dur=c.dur||30;if(c.at)x.at=c.at;else delete x.at}}
    else{const o=Object.assign({},(d.ovr||{})[c.id]);if(c.name!==B.name)o.name=c.name;if((c.at||"")!==(B.at||""))o.at=c.at||"";
      d.ovr=Object.assign({},d.ovr||{});if(Object.keys(o).length)d.ovr[c.id]=o;if(c.dur&&c.dur!==B.dur)d.dur[c.id]=c.dur}
    save();render();toast("Сохранил на сегодня");return}
  if(a==="mvdel"){const id=W.id,d=dayOf(key());closeSheet();
    mutate(()=>{const c=d.custom.find(x=>x.id===id);
      if(c){d.custom=d.custom.filter(x=>x!==c);d.done=d.done.filter(x=>x!==id);(d.del=d.del||[]).push(id)}
      else if(id.startsWith("ch_")){const ch=H.chores.find(x=>"ch_"+x.id===id);if(ch){delete ch.who;touch(ch)}}
      else if(id.startsWith("pr_")){const st=stepOf(id);if(st){delete st.who;touch(st)}}
      else if(id==="buy"){for(const {x} of myBuys()){delete x.who;touch(x)}}
      else if(!d.skip.includes(id))d.skip.push(id);
      logEv(d,"skip",id)});toast("Убрал. План пересчитан");return}
  if(a.startsWith("pn:")){const v=nmV();W.name=v;W.n=+a.slice(3);return renderSheet()}
  if(a==="prepsave"){const v=nmV();if(!v){toast("Напиши, что приготовил");return}const n=W.n;closeSheet();mutate(()=>prepAdd(v,n));toast("Заготовка: "+v+", "+n+" порц.");return}
  if(a.startsWith("lvl:")){const x=H.items.find(i=>i.id===W.id);if(x){const l=a.slice(4);mutate(()=>{x.level=l;if(l==="out"&&x.amt!=null)x.amt=0;if(l==="ok"){const u=untilFor(x.name,x.cat);if(u)x.until=u}else if(l==="out")delete x.until;touch(x)})}return renderSheet()}
  if(a==="pmin"||a==="pplus"){const x=H.items.find(i=>i.id===W.id);if(!x)return;if(a==="pmin"){mutate(()=>prepEat(x));if(!x.n)return closeSheet()}else mutate(()=>{x.n=(x.n|0)+1;touch(x)});return renderSheet()}
  if(a==="hidel"){const id=W.id;closeSheet();mutate(()=>{H.items=H.items.filter(i=>i.id!==id);H.del.push(id)});toast("Удалил");return}
  if(a==="sbought"){const x=(W.kind==="item"?H.items:H.shop).find(i=>i.id===W.id),kind=W.kind;closeSheet();if(x)mutate(()=>markBought(kind,x));toast("Куплено");return}
  if(a==="stake"){const x=(W.kind==="item"?H.items:H.shop).find(i=>i.id===W.id);if(x)mutate(()=>{if(isMe(x.who))delete x.who;else x.who=ME();touch(x)});closeSheet();return}
  if(a==="sok"){const x=H.items.find(i=>i.id===W.id);closeSheet();if(x)mutate(()=>{x.level="ok";delete x.who;touch(x)});return}
  if(a==="sdel2"){const id=W.id;closeSheet();mutate(()=>{H.shop=H.shop.filter(i=>i.id!==id);H.del.push(id)});return}
  if(a==="cdone"){const c=H.chores.find(i=>i.id===W.id),id="ch_"+W.id;closeSheet();if(!c)return;
    if(c.last===key()&&has(dayOf(key()),id)){toast("Уже отмечено сегодня");return}
    toggle(id);toast("Сделано: "+c.name);return}
  if(a==="ctake"){const c=H.chores.find(i=>i.id===W.id);closeSheet();if(c)mutate(()=>{if(isMe(c.who))delete c.who;else c.who=ME();touch(c)});toast(c&&c.who!=null?"Взял. Уже в твоём плане":"Отдал, в плане больше нет");return}
  if(a==="cdel2"){const id=W.id;closeSheet();mutate(()=>{H.chores=H.chores.filter(i=>i.id!==id);H.del.push(id)});toast("Дело удалено");return}
  if(a==="stdone"){const p=H.projects.find(x=>x.id===W.pid),st=p&&p.steps.find(x=>x.id===W.sid);closeSheet();if(st){const sid="pr_"+p.id+"_"+st.id;if(has(dayOf(key()),sid)||(!st.done&&isMe(st.who)))toggle(sid);else mutate(()=>{st.done=!st.done;if(st.done)delete st.who;touch(st)})}return}
  if(a==="sttake"){const p=H.projects.find(x=>x.id===W.pid),st=p&&p.steps.find(x=>x.id===W.sid);closeSheet();if(st)mutate(()=>{if(isMe(st.who))delete st.who;else st.who=ME();touch(st)});return}
  if(a==="stdel"){const p=H.projects.find(x=>x.id===W.pid),sid=W.sid;closeSheet();if(p)mutate(()=>{p.steps=p.steps.filter(x=>x.id!==sid);touch(p)});return}
  if(a.startsWith("hc:")){W.name=nmV();const c=a.slice(3);W.cat=W.cat===c?"":c;return renderSheet()}
  if(a==="hnsave"){const v=nmV().slice(0,80),w=W.what;if(!v){toast("Напиши название");return}
    const every=$("hnevery")?+$("hnevery").value:7,due=$("hndue")?$("hndue").value:"",cat=W.cat,n=W.n;closeSheet();
    mutate(()=>{if(w==="cat:prep")prepAdd(v,n);else if(w==="food"||w.startsWith("cat:"))hAdd(v,cat||(w.startsWith("cat:")?w.slice(4):""));
      else if(w==="shop")H.shop.push(touch({id:hid("s"),name:v.slice(0,60),done:false}));
      else if(w==="chore")H.chores.push(touch({id:hid("c"),name:v.slice(0,50),every,dur:20,last:null}));
      else if(w==="proj"){const p=touch({id:hid("p"),name:v.slice(0,60),steps:[]});if(due)p.due=due;H.projects.push(p);homeSeg="proj:"+p.id}
      else if(w.startsWith("step:")){const p=H.projects.find(x=>x.id===w.slice(5));if(p){p.steps.push(touch({id:hid("s"),t:v.slice(0,100),done:false}));touch(p)}}});
    toast("Добавил");return}
  if(a==="game"){closeSheet();return askGame()}
  if(a==="back"){const SS=PSTEPS.includes(W.step)?PSTEPS:STEPS,i=SS.indexOf(W.step);W.step=i>0?SS[i-1]:(SS===PSTEPS?W.step:"menu");return renderSheet()}
  if(a==="pnext"||a==="psave"){const v=$("sheet").querySelector("input[name=v]");if(v){if(W.step==="pcity")W.prefs.city=v.value.trim().slice(0,40);if(W.step==="pmore")W.prefs.more=v.value.trim().slice(0,120)}

  try{const r=await fetchGoal({text:gText(w)});if(W!==w)return;w.qs=r;if(!(r.questions||[]).length){goalPlan("");return}w.step="gq";renderSheet()}
  catch(e){if(W===w){w.step="gtext";renderSheet();toast("Не получилось, попробуй ещё раз")}}}
async function goalPlan(fix){const w=W;const answers=((w.qs&&w.qs.questions)||[]).map(q=>({q:q.q,a:w.ans[q.id]||""}));
  w.step="gload";w.msg=fix?"Переделываю план…":"Составляю план…";renderSheet();
  try{const r=await fetchGoal({text:gText(w),answers,fix,prev:fix?w.plan:null});if(W!==w)return;if(!r.plan)throw new Error("no plan");
    w.plan=r.plan;w.rw=!!r.plan.reward_day&&!prof().reward;w.pn=false;w.fixing=false;w.step="gplan";renderSheet()}
  catch(e){if(W===w){w.step=w.plan?"gplan":"gq";if(!w.qs)w.step="gtext";renderSheet();toast("Не получилось, попробуй ещё раз")}}}
// перегруз: самый плотный день недели после добавления дел цели
function overload(tasks){const P=prof(),free=Math.max(60,toMin(P.bed)-toMin(P.wake)-60);let worst=null;
  for(const wd of [1,2,3,4,5,6,0]){let sum=ritems().filter(it=>onDay(it,wd)).reduce((n,it)=>n+(it.dur||30),0);
    for(const t of tasks||[]){if(t.once||(t.use&&ritem(t.use)))continue;if(!t.days||!t.days.length||t.days.includes(wd))sum+=t.dur||30}
    if(sum>free&&(!worst||sum-free>worst.over))worst={wd,sum,over:sum-free}}
  return worst?`В ${["вс","пн","вт","ср","чт","пт","сб"][worst.wd]} дел на ${durTxt(worst.sum)}, а между подъёмом и отбоем ${durTxt(free)}. Можно убрать дело ✕ или «Поправить».`:""}
function goalCreate(){const w=W,P0=w.plan,gid=w.health?"health":hid("g"),old=w.health?healthGoal():null,keep=new Set(P0.tasks.map(t=>t.use).filter(Boolean));
  let R=clone(prof().routine);const ids=[];if(old)R=R.filter(x=>!(old.tasks||[]).includes(x.id)||keep.has(x.id));const ci=R.findIndex(x=>x.id==="_custom");
  closeSheet();
  mutate(()=>{
    for(const t of P0.tasks){
      if(t.use&&R.find(x=>x.id===t.use)){const it=R.find(x=>x.id===t.use);it.main=1;ids.push(it.id);continue}
      if(t.once){const d=dayOf(t.once);d.custom.push({id:"c"+Date.now().toString(36)+ids.length,name:t.name,dur:t.dur||30});continue}
      const it={id:"r"+Date.now().toString(36)+ids.length,name:t.name,dur:t.dur||30,main:1};if(t.days&&t.days.length&&t.days.length<7)it.days=t.days.slice();if(t.at)it.at=t.at;
      if(ci>=0)R.splice(R.findIndex(x=>x.id==="_custom"),0,it);else R.push(it);ids.push(it.id)}
    const patch={routine:R};if(w.rw&&P0.reward_day)patch.reward=P0.reward_day;if(w.pn&&ids.length)patch.penalty={task:ids[0],fine:P0.penalty_fine||5,to:(prof().penalty||{}).to||"копилку"};
    setProf(patch);
    const m=P0.metric?{name:P0.metric.name,unit:P0.metric.unit,start:P0.metric.start??0,target:P0.metric.target,mode:P0.metric.mode,ask:P0.metric.ask,src:"m"}:null;
    const kgM=w.health&&m&&/кг|kg/i.test(m.unit||"");if(kgM){m.src="body";m.mode="set";if(m.target)state.goals=Object.assign({},state.goals||{},{goalKg:m.target});if(m.start&&!state.body.some(b=>b.d===key()))state.body.push({d:key(),kg:m.start})}
    if(m&&!kgM)state.metrics=Object.assign({},state.metrics||{},{[gid]:[{d:key(),v:m.start}]});
    state.tgoals=Object.assign({},state.tgoals||{});state.gifts=Object.assign({},state.gifts||{});
    const ns=kgM?"body":"n_"+gid;
    if(m&&P0.milestones.length){const st=P0.milestones.map(x=>({id:hid("t"),at:x.at,budget:x.budget}));state.tgoals[ns]={steps:st};st.forEach((s,i)=>{if(P0.milestones[i].gift)state.gifts["t_"+ns+"_"+s.id]=P0.milestones[i].gift})}
    if(ids.length&&P0.streak.length){const st=P0.streak.map(x=>({id:hid("t"),at:x.days,budget:x.budget}));state.tgoals["h_"+gid]={steps:st};st.forEach((s,i)=>{if(P0.streak[i].gift)state.gifts["h_"+gid+"_"+s.id]=P0.streak[i].gift})}
    const ng={id:gid,name:P0.name,emoji:P0.emoji,status:"active",tasks:ids,metric:m,date:P0.date||null,created:key()};if(w.health){ng.kind="health";if(!P0.emoji)ng.emoji="💪"}
    saveGoals(ALLGOALS().filter(g=>g.id!==gid).concat([ng]))});
  if(w.fromBrain){const x=bById(w.fromBrain);if(x)mutate(()=>{x.st="used";delete x.pin;touch(x)})}
  if(w.health){tab="me";meSeg="health"}else{tab="goals";goalSeg=gid}
  render();window.scrollTo(0,0);haptic("success");toast(w.health?"Здоровье настроено. Дела уже в плане":"Цель «"+P0.name+"» в работе. Дела уже в плане")}
function gKeep(){const f=$("sheet").querySelector("form[data-wf=goal]");if(f){W.g.name=f.name.value.trim().slice(0,40);W.g.unit=f.unit.value.trim().slice(0,30)}}
function openRoutine(id){const it=id==="+"?null:ritem(id);W={step:"ritem",isNew:!it,it:it?clone(it):{id:"r"+Date.now().toString(36),name:"",dur:30}};renderSheet()}
$("sheet").addEventListener("change",e=>{if(e.target.id==="mvdate"&&e.target.value){W.to=e.target.value;renderSheet()}});
$("sheet").addEventListener("submit",e=>{e.preventDefault();e.stopPropagation();const f=e.target.dataset.wf;if(f==="hnew"){$("sheet").querySelector("[data-w=hnsave]").click();return}if(f==="prep"){$("sheet").querySelector("[data-w=prepsave]").click();return}if(f==="ritem"){$("sheet").querySelector("[data-w=rsave]").click();return}if(f==="cedit"){$("sheet").querySelector("[data-w=cesave]").click();return}if(f==="goal"){$("sheet").querySelector("[data-w=gnsave]").click();return}if(f==="gval"){$("sheet").querySelector("[data-w=gvsave]").click();return}if(f==="gnum"){$("sheet").querySelector("[data-w=gnsave2]").click();return}if(f==="gq"){$("sheet").querySelector("[data-w=gqnext]").click();return}if(f==="house"){$("sheet").querySelector("[data-w=hbuy]").click();return}if(f==="p"){$("sheet").querySelector("[data-w=pnext],[data-w=psave]").click();return}if(f==="g"){$("sheet").querySelector("[data-w=gsave]").click();return}if(f==="c"){$("sheet").querySelector("[data-w=csave]").click();return}if(f==="name")wNext();if(f==="weight")$("sheet").querySelector("[data-w=saveweight]").click()});
$("plus").onclick=openSheet;
document.addEventListener("keydown",e=>{if(e.key==="Escape"&&W)closeSheet()});

/* ---------- фокус ---------- */
const WORK=50*60,BREAK=10*60;
let F={phase:"work",endsAt:0,left:WORK,running:false,session:1},tick=null;
function loadF(){try{const v=JSON.parse(localStorage.getItem("qd-focus")||"null");if(v&&v.day===key())F=Object.assign(F,v)}catch(e){}}
function saveF(){try{localStorage.setItem("qd-focus",JSON.stringify(Object.assign({day:key()},F)))}catch(e){}}
const remain=()=>F.running?Math.max(0,Math.round((F.endsAt-Date.now())/1000)):F.left;
let focusId=null;
function openFocus(id){loadF();const d=dayOf(key());
  const it=ritem(id)&&ritem(id).steps?ritem(id):ritems().find(x=>x.steps&&onDay(x,dow(key())));if(!it)return;focusId=it.id;
  if(!d.cur||d.cur.id!==it.id)mutate(()=>{d.cur={id:it.id,at:hhmm()};logEv(d,"start",it.id)});
  if(!F.running&&F.left===WORK&&F.phase==="work"){F.running=true;F.endsAt=Date.now()+WORK*1000}
  saveF();$("focus").hidden=false;document.body.style.overflow="hidden";renderFocus();clearInterval(tick);tick=setInterval(stepTimer,1000)}
function closeFocus(){$("focus").hidden=true;document.body.style.overflow="";clearInterval(tick);render()}
function stepTimer(){
  if(F.running&&remain()<=0){
    if(F.phase==="work"){F.phase="break";F.endsAt=Date.now()+BREAK*1000;toast("50 минут есть. Перерыв 10 минут.");haptic("success")}
    else{F.phase="work";F.session++;F.endsAt=Date.now()+WORK*1000;toast("Перерыв всё. Сессия "+F.session+".");haptic("warning")}
    saveF();}
  renderFocus(true);
}
function renderFocus(onlyTime){
  const s=remain(),mm=pad(Math.floor(s/60)),ss=pad(s%60),tot=F.phase==="work"?WORK:BREAK,C=2*Math.PI*104,off=C*(1-s/tot);
  if(onlyTime&&$("ftime")){$("ftime").textContent=mm+":"+ss;$("farc").setAttribute("stroke-dashoffset",off.toFixed(1));return}
  const d=dayOf(key()),it=ritem(focusId);if(!it){closeFocus();return}const st=nextStep(d,it);
  const list=it.steps.map(x=>`<div class="${has(d,x.id)?"done":x===st?"cur":""}"><span class="dot">${has(d,x.id)?IC.check:""}</span>${esc(x.name)}</div>`).join("");
  const main=!st?`<button type="button" class="goldbtn" id="fclose2">Готово. Закрыть</button>`:locked(st)?`<button type="button" class="goldbtn" data-proof="1">Кинуть пруф боту</button>`:`<button type="button" class="goldbtn" data-t="${st.id}">Готово, следующий шаг</button>`;
  $("focus").innerHTML=`<div class="top"><button type="button" class="back" id="fclose" aria-label="Назад">${IC.back}</button><span style="font-size:14px;font-weight:800;color:var(--muted)">${F.phase==="work"?"Сессия "+F.session:"Перерыв"}</span><span style="width:44px"></span></div>
    <div class="ring"><svg width="240" height="240" viewBox="0 0 240 240" role="img" aria-label="Осталось ${mm} минут"><circle cx="120" cy="120" r="104" fill="none" stroke="#2a1d16" stroke-width="12"/><circle id="farc" cx="120" cy="120" r="104" fill="none" stroke="${F.phase==="work"?"#e5603f":"#6c9a7d"}" stroke-width="12" stroke-linecap="round" stroke-dasharray="${C.toFixed(1)}" stroke-dashoffset="${off.toFixed(1)}" transform="rotate(-90 120 120)"/></svg>
      <div class="c"><b id="ftime">${mm}:${ss}</b><span>${F.phase==="work"?(F.running?"до перерыва":"на паузе"):"отдых"}</span></div></div>
    <div class="fstep"><h2>${st?esc(st.name):esc(it.name)+": готово"}</h2><p>${st?esc(st.hint||""):"Красавчик. В зачёт награды."}</p></div>
    <div class="flist">${list}</div>
    <div class="factions"><span class="tip">Телефон экраном вниз. Отдых подождёт до конца.</span>${main}<button type="button" class="line" id="fpause">${F.running?"Пауза":"Продолжить"}</button></div>`;
  $("fclose").onclick=closeFocus;if($("fclose2"))$("fclose2").onclick=closeFocus;
  $("fpause").onclick=()=>{if(F.running){F.left=remain();F.running=false}else{F.running=true;F.endsAt=Date.now()+F.left*1000}saveF();renderFocus()};
}

setInterval(()=>{if($("focus").hidden&&!W&&!document.querySelector("form.add input:focus"))render()},60000);

/*STORAGE: Telegram Mini App, данные в базе бота*/

if(tg){try{tg.ready();tg.expand();tg.setHeaderColor("#2a1a12");tg.setBackgroundColor("#17110e")}catch(e){}}
const hdr=()=>({"Content-Type":"application/json","X-Init-Data":tg?tg.initData:""});
async function pull(){
  try{const r=await fetch("api/state",{headers:hdr()});if(!r.ok)throw new Error(r.status);
    state=norm(await r.json());window.QD_LOADED=true;render()}
  catch(e){toast("Нет связи с ботом. Открой квест кнопкой в боте.")}
}
let st;
save=()=>{clearTimeout(st);st=setTimeout(async()=>{
  try{const r=await fetch("api/state",{method:"POST",headers:hdr(),body:JSON.stringify(state)});
    if(r.ok){state=norm(await r.json());render()}}catch(e){}},500)};
async function fetchGoal(q){const r=await fetch("api/goal",{method:"POST",headers:hdr(),body:JSON.stringify(q)});const v=await r.json().catch(()=>({}));if(!r.ok)throw new Error(v.error||r.status);return v}
async function fetchCook(){const r=await fetch("api/cook",{method:"POST",headers:hdr(),body:"{}"});const v=await r.json().catch(()=>({}));if(!r.ok)throw new Error(v.error||r.status);return v.ideas||[]}
async function fetchBrain(text,file){let r;if(file){const fd=new FormData();fd.append("text",text||"");fd.append("file",file,file.name||"file");r=await fetch("api/brain",{method:"POST",headers:{"X-Init-Data":tg?tg.initData:""},body:fd})}else r=await fetch("api/brain",{method:"POST",headers:hdr(),body:JSON.stringify({text})});const v=await r.json().catch(()=>({}));if(!r.ok)throw new Error(v.error||r.status);return v}
async function fetchInvite(house){const r=await fetch("api/invite",{method:"POST",headers:hdr(),body:JSON.stringify({house:!!house})});const v=await r.json().catch(()=>({}));if(!r.ok||!v.link)throw new Error(v.error||r.status);return v.link}
async function fetchGifts(q){const r=await fetch("api/gifts",{method:"POST",headers:hdr(),body:JSON.stringify(q)});const v=await r.json().catch(()=>({}));if(!r.ok)throw new Error(v.error||r.status);return v.ideas||[]}
render();pull();
document.addEventListener("visibilitychange",()=>{if(!document.hidden)pull()});
if(tg)tg.onEvent("activated",pull);
/*END STORAGE*/
