<!doctype html>
<html lang="ru"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<script>window.QD_MODE="bot"</script>
<title>Квест дня</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Russo+One&family=Manrope:wght@500;600;700;800&display=swap">
<style>
/* Один тёмный вид (боевой пропуск): бронза и огонь. Тема намеренно одна. */
:root{
  --bg:#17110e; --panel:#201712; --panel2:#2a1a12; --line:#3a2b22; --line2:#4a3426;
  --fg:#f3e9dd; --muted:#b3a193; --dim:#8e7c6d;
  --gold:#e0a456; --fire:#e5603f; --fire2:#f08a5d; --ok:#6c9a7d; --okl:#7fc79c; --red:#e0705a;
  --paper:#f3e9dd; --ink:#1d1410; --rust:#8a4b1c; --paperline:#e9c3a8;
  --display:"Russo One","Manrope",system-ui,sans-serif;
  --body:"Manrope",system-ui,-apple-system,"Segoe UI",sans-serif;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{background:var(--bg)}
body{color:var(--fg);font:15px/1.45 var(--body);margin:0}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
[hidden]{display:none!important}
.app{max-width:520px;margin:0 auto;padding-bottom:calc(88px + env(safe-area-inset-bottom,0px))}

.appbar{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;display:flex;align-items:center;justify-content:space-between;gap:12px;padding:14px 16px 12px;background:var(--bg)}
.appbar .tt{display:flex;flex-direction:column;min-width:0}
.appbar h1{font-family:var(--display);font-weight:400;font-size:28px;line-height:1.1;margin:0}
.appbar .sub{font-size:13px;font-weight:700;color:var(--muted)}
.appbar .sub::first-letter{text-transform:uppercase}
.pills{display:flex;gap:8px;flex-shrink:0}
.pill{display:flex;align-items:center;gap:6px;height:38px;white-space:nowrap;flex-shrink:0;padding:0 12px;border-radius:19px;background:var(--panel);border:1px solid var(--line2);font-family:var(--display);font-size:16px;color:var(--fg)}
.pill svg{width:18px;height:18px}
.pill.fire{color:#ff8a5c}.pill.fire.zero{color:var(--dim)}
.pill.navplus{min-width:58px;display:grid;place-items:center;background:none;border:none;padding:0}
.navplus span{width:54px;height:54px;margin-top:-22px;border-radius:50%;background:var(--gold);color:var(--ink);display:grid;place-items:center;box-shadow:0 6px 18px rgba(224,164,86,.3);border:4px solid #1c1511}
.rqlist{display:flex;flex-direction:column;gap:6px}
.rqlist div{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:12px;background:var(--panel);font-weight:700}
.rqlist .c{width:24px;height:24px;border-radius:7px;border:2px solid var(--line2);display:grid;place-items:center;flex-shrink:0}
.rqlist .on .c{background:var(--ok);border-color:var(--ok)}
.rqlist .on{color:var(--dim)}
.confirm{margin:12px 16px 0;padding:14px;border-radius:16px;background:var(--panel2);border:1px solid var(--gold);display:flex;flex-direction:column;gap:10px}
.confirm p{margin:0;font-size:14px;color:#d9c9b9}
.confirm .warn{color:var(--red);font-weight:700}
.btns{display:flex;gap:8px}
.btns button{flex:1;height:46px;border-radius:12px;font-weight:800;border:1px solid var(--line2);background:transparent}
.btns .pri{background:var(--gold);color:var(--ink);border-color:var(--gold)}

.daybar{margin:0 16px 14px;display:flex;flex-direction:column;gap:6px}
.track{display:flex;height:12px;border-radius:6px;overflow:hidden;background:var(--line)}
.track i{display:block;height:100%;border-right:2px solid var(--bg)}
.track .t{background:#5a4131}.track .v{background:var(--fire)}.track .g{background:var(--gold)}.track .f{background:#2f4a3b}.track .o{background:var(--red)}.track .a{background:#3a2b22}
.dline{display:flex;justify-content:space-between;gap:8px;font-size:13px;font-weight:700;color:var(--muted)}
.dline b{color:var(--fg);font-variant-numeric:tabular-nums}
.dline .free b{color:var(--okl)}.dline .minus b{color:var(--red)}
.plus{width:48px;height:48px;border-radius:50%;border:none;background:var(--gold);color:var(--ink);display:grid;place-items:center;flex-shrink:0;box-shadow:0 4px 16px rgba(224,164,86,.25)}
/* окошки добавления */
.sheet{position:fixed;inset:0;z-index:25;display:flex;flex-direction:column;justify-content:flex-end;background:rgba(10,7,5,.6)}
.sheet .pnl{background:var(--panel2);border-radius:22px 22px 0 0;border-top:1px solid var(--line2);padding:16px 16px calc(20px + env(safe-area-inset-bottom,0px));max-width:520px;width:100%;margin:0 auto;display:flex;flex-direction:column;gap:14px;max-height:88vh;overflow-y:auto}
.sheet .sbar{display:flex;align-items:center;justify-content:space-between;gap:8px}
.sheet .dots{display:flex;gap:6px}
.sheet .dots i{width:22px;height:5px;border-radius:3px;background:var(--line2)}
.sheet .dots i.on{background:var(--gold)}
.sheet h2{font-family:var(--display);font-weight:400;font-size:22px;margin:0}
.sheet .q{font-size:14px;color:var(--muted);margin:-8px 0 0}
.sheet input{height:52px;border-radius:14px;border:1px solid var(--line2);background:var(--bg);padding:0 14px;color:var(--fg);font-size:17px;width:100%}
.opts{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.opts.three{grid-template-columns:repeat(3,minmax(0,1fr))}
.opt{min-height:52px;border-radius:14px;border:1px solid var(--line2);background:var(--panel);font-weight:700;font-size:15px;padding:8px;text-align:center}
.opt small{display:block;font-size:12px;font-weight:600;color:var(--muted)}
.opt[aria-pressed="true"]{border-color:var(--gold);background:#3a2416;color:var(--gold)}
.menu{display:flex;flex-direction:column;gap:8px}
.menu .opt{display:flex;align-items:center;gap:12px;text-align:left;padding:12px 14px}

.now{margin:0 16px;padding:18px 16px;border-radius:22px;background:var(--paper);color:var(--ink);display:flex;flex-direction:column;gap:12px}
.now .k{display:flex;justify-content:space-between;gap:8px;font-size:13px;font-weight:800;color:var(--rust)}
.now h2{font-family:var(--display);font-weight:400;font-size:26px;line-height:1.1;margin:0}
.now p{margin:4px 0 0;font-size:14px;color:#5a4436}
.clock{display:flex;align-items:baseline;gap:10px}
.clock b{font-family:var(--display);font-weight:400;font-size:40px;line-height:1;font-variant-numeric:tabular-nums}
.clock span{font-size:14px;font-weight:700;color:#5a4436}
.now.late{background:#f6ddd3}.now.late .clock b,.now.late .k{color:#b0391f}
.now.free{background:var(--panel);color:var(--fg);border:1px solid var(--line2)}
.now.free .k{color:var(--gold)}.now.free p{color:var(--muted)}
.segs{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:4px}
.seg{height:6px;border-radius:3px;background:var(--paperline)}.seg.on{background:var(--fire)}
.bigbtn{height:56px;border:none;border-radius:16px;background:var(--ink);color:var(--paper);font-weight:800;font-size:17px;display:flex;align-items:center;justify-content:center;gap:10px;width:100%}
.ghost{height:46px;border-radius:14px;background:transparent;border:1px solid #cdb39c;color:var(--ink);font-weight:700;font-size:15px;width:100%}
.now.free .ghost{border-color:var(--line2);color:var(--fg)}


.sec{display:flex;justify-content:space-between;align-items:baseline;padding:18px 20px 8px}
.sec h3{margin:0;font-size:15px;font-weight:800}
.sec span,.sec button{font-size:13px;font-weight:700;color:var(--muted);background:none;border:none;padding:0}
.list{display:flex;flex-direction:column;gap:6px;padding:0 16px}
nav.tabs .ico{position:relative;display:grid}
.badge{position:absolute;top:-6px;right:-10px;min-width:18px;height:18px;padding:0 5px;border-radius:9px;background:var(--red);color:#fff;font-style:normal;font-size:11px;font-weight:800;line-height:18px;text-align:center}
.hrow{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:14px;background:var(--panel);min-height:50px}
.hrow .nm{flex:1;min-width:0;display:flex;flex-direction:column}
.hrow .nm b{font-size:15px;font-weight:700;overflow-wrap:anywhere}.hrow .nm small{font-size:12px;font-weight:700;color:var(--muted)}
.hrow .nm small.bad{color:var(--red)}
.hrow .chk{width:30px;height:30px;flex-shrink:0;border-radius:9px;border:2px solid var(--line2);background:transparent;display:grid;place-items:center}
.hrow .chk.on{background:var(--ok);border-color:var(--ok)}
.hrow select,.mini select{background:var(--panel2);color:var(--fg);border:1px solid var(--line2);border-radius:10px;height:34px;padding:0 8px;font:inherit;font-weight:700}
.add select{flex:1;background:var(--panel2);color:var(--fg);border:1px solid var(--line2);border-radius:12px;height:44px;padding:0 10px;font:inherit}
.lvl{height:30px;padding:0 10px;border-radius:15px;border:1px solid var(--line2);background:transparent;font-size:12px;font-weight:800;color:var(--okl);flex-shrink:0}
.lvl.low{color:var(--gold);border-color:#6b5230}.lvl.out{color:var(--red);border-color:#6b3328}
.cats{display:flex;gap:6px;flex-wrap:wrap}
.cats .chip[aria-pressed="true"]{background:var(--panel2);border-color:var(--gold);color:var(--fg)}
.perm{display:flex;flex-wrap:wrap;gap:6px}
.perm .chip{font-size:12px;min-height:30px;padding:4px 8px}
.perm .chip[aria-pressed="true"]{border-color:var(--okl);color:var(--okl)}
.idea{display:flex;flex-direction:column;gap:4px;padding:10px 12px;border-radius:14px;background:var(--panel2)}
.row{display:flex;align-items:center;gap:12px;padding:10px 12px;border-radius:14px;background:var(--panel);border:1px solid transparent;text-align:left;width:100%;min-height:54px}
.row .tm{width:50px;flex-shrink:0;display:flex;flex-direction:column;font-size:13px;font-weight:800;font-variant-numeric:tabular-nums;line-height:1.2}
.row .tm small{font-size:11px;font-weight:600;color:var(--dim)}
.row .nm{flex:1;min-width:0;display:flex;flex-direction:column}
.row .nm b{font-size:15px;font-weight:700}
.row .nm small{font-size:12px;color:var(--muted)}
.row .chk{width:30px;height:30px;flex-shrink:0;border-radius:9px;border:2px solid var(--line2);background:transparent;display:grid;place-items:center;padding:0}
.rowmain{flex:1;min-width:0;display:flex;align-items:center;gap:10px;background:none;border:none;padding:4px 0;text-align:left;color:inherit;min-height:44px}
.row.cur{border-color:var(--gold)}
.row .x{width:32px;height:32px}
.row.on{opacity:.7}.row.on .chk{background:var(--ok);border-color:var(--ok)}
.row.on .nm b{color:var(--dim);text-decoration:line-through}
.row.boss{background:var(--panel2);border-color:var(--fire)}
.row.game{background:#2a2014;border-color:var(--gold)}
.row.anchor{border-color:var(--line2)}
.row.gap{background:transparent;border:1px dashed var(--line);min-height:40px;padding:8px 12px}
.row.gap .nm b{font-size:13px;color:var(--dim);font-weight:700}
.pin{font-size:11px;font-weight:800;color:var(--gold);margin-left:6px}
.tok{width:26px;height:26px;flex-shrink:0;border-radius:50%;border:1px dashed #3c6b52;color:var(--okl);display:grid;place-items:center}
.tok svg{width:14px;height:14px}
.row.on .tok{background:var(--gold);border-style:solid;color:var(--ink)}
.dur{font-size:12px;font-weight:700;color:var(--dim);white-space:nowrap}
.x{width:36px;height:36px;border-radius:10px;border:none;background:transparent;color:var(--dim);display:grid;place-items:center;flex-shrink:0}
.over{margin:12px 16px 0;padding:12px 14px;border-radius:16px;border:1px solid var(--red);background:#2a1712;display:flex;flex-direction:column;gap:10px}
.over h3{margin:0;font-size:15px;color:var(--red)}
.over .it{display:flex;align-items:center;gap:8px}
.over .it b{flex:1;min-width:0;font-size:14px}
.chip{border-radius:10px;border:1px solid var(--line2);background:transparent;font-size:13px;font-weight:700;padding:6px 10px;min-height:36px}

.add{display:flex;flex-direction:column;gap:8px;margin:10px 16px 0;padding:12px;border-radius:16px;background:var(--panel)}
.add .r{display:flex;gap:8px}
.add input,.add select{min-width:0;height:44px;border-radius:12px;border:1px solid var(--line2);background:var(--bg);padding:0 10px;color:var(--fg)}
.add input[name=t]{flex:1}
.add input::placeholder{color:var(--dim)}
.add .lab{font-size:12px;color:var(--muted);font-weight:700}
.add button{height:44px;border-radius:12px;border:none;background:var(--gold);color:var(--ink);font-weight:800;padding:0 16px}

.card{margin:0 16px;padding:14px;border-radius:18px;background:var(--panel);display:flex;flex-direction:column;gap:10px}
.tiles{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px;margin:10px 16px 0}
.tile{padding:12px 14px;border-radius:16px;background:var(--panel);display:flex;flex-direction:column;gap:2px}
.tile b{font-family:var(--display);font-weight:400;font-size:26px;font-variant-numeric:tabular-nums}
.tile span{font-size:13px;color:var(--muted);font-weight:600}
.hero{margin:0 16px;padding:16px;border-radius:22px;background:linear-gradient(135deg,#2c1a12,#201712);border:1px solid var(--line2);display:flex;align-items:center;justify-content:space-between;gap:12px}
.hl2{display:flex;align-items:center;gap:12px;min-width:0}
.hl2 .flame{width:52px;height:52px;border-radius:16px;background:#3a1d14;color:#ff8a5c;display:grid;place-items:center;flex-shrink:0}
.hl2 .flame svg{width:30px;height:30px}
.hl2 .flame.yt{background:#3a1616;color:#ff5b4f}
.delta{color:var(--okl)}
.hl2 b{display:block;font-family:var(--display);font-weight:400;font-size:40px;line-height:1}
.hl2 small{display:block;font-size:13px;font-weight:700;color:var(--muted)}
.hl2 small.dim{color:var(--dim);font-weight:600}
.ring2{position:relative;width:84px;height:84px;flex-shrink:0}
.ring2>div{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center}
.ring2 b{font-family:var(--display);font-weight:400;font-size:22px;line-height:1}
.ring2 small{font-size:10px;font-weight:700;color:var(--muted)}
.fcard{margin:14px 16px 0;padding:16px;border-radius:20px;background:var(--panel);border:1px solid var(--line2);display:flex;flex-direction:column;gap:10px}
.fcard.open{background:#2a2014;border-color:var(--gold)}
.fcard .k{font-size:13px;font-weight:800;color:var(--gold)}
.fcard .fh{display:flex;align-items:center;gap:12px}
.fcard .fh b{display:block;font-size:17px}.fcard .fh small{font-size:13px;font-weight:700;color:var(--muted)}
.fcard p{margin:0;font-size:14px;color:#d9c9b9}
.segc{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:4px;margin:18px 16px 10px;padding:4px;border-radius:14px;background:var(--panel)}
.segc button{height:38px;border:none;border-radius:10px;background:transparent;color:var(--muted);font-weight:800;font-size:14px}
.segc button[aria-selected="true"]{background:var(--panel2);color:var(--fg);box-shadow:inset 0 0 0 1px var(--line2)}
.lrow{display:flex;align-items:center;gap:12px;width:100%;padding:12px 14px;border-radius:16px;background:var(--panel);border:1px solid transparent;text-align:left;color:inherit}
.lrow.open{border-color:var(--gold);background:#2a2014}
.lrow.got{opacity:.6}
.lrow .rt{flex:1;min-width:0;display:flex;flex-direction:column}
.lrow .rt b{font-size:15px}.lrow .rt small{font-size:12px;font-weight:700;color:var(--muted)}
.lrow .rt em{font-style:normal;font-size:13px;color:#d9c9b9;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.lrow .rt em.none{color:var(--dim)}
.rs{width:28px;height:28px;display:grid;place-items:center;flex-shrink:0}
.rs.ok svg{stroke:var(--okl)}.rs.open svg{stroke:var(--gold)}
.segfoot{padding:10px 16px 0}
.rb{width:40px;height:40px;border-radius:12px;background:var(--panel2);border:1px solid var(--line2);display:grid;place-items:center;font-family:var(--display);font-size:16px;color:var(--gold);flex-shrink:0}
.rb svg{width:20px;height:20px}
.lrow.open .rb,.fcard.open .rb{background:var(--gold);color:var(--ink)}
.lrow.open .rb svg,.fcard.open .rb svg{stroke:var(--ink)}
.rt{display:flex;flex-direction:column;min-width:0}
.rt b{font-size:15px}.rt small{font-size:12px;color:var(--muted);font-weight:700}
.wins{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:6px}
.win{display:flex;flex-direction:column;align-items:center;gap:4px}
.win i{width:100%;height:28px;border-radius:8px;background:var(--line)}
.win.on i{background:var(--fire)}.win.today i{outline:2px solid var(--gold);outline-offset:2px}
.win span{font-size:11px;font-weight:700;color:var(--muted)}
.mini{display:flex;flex-direction:column;gap:4px;font-size:14px}
.mini div{display:flex;justify-content:space-between;gap:8px;color:var(--muted)}
.mini b{color:var(--fg);font-weight:700;font-variant-numeric:tabular-nums}
.big{font-family:var(--display);font-weight:400;font-size:30px;font-variant-numeric:tabular-nums}
.ex{display:flex;flex-direction:column;gap:6px}
.ex .top{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.ex .top b{font-size:16px}
.ex .top span{font-size:13px;font-weight:700;color:var(--okl)}
.pr{font-size:12px;font-weight:800;color:var(--gold)}
.empty{font-size:13px;color:var(--dim);margin:0}

nav.tabs{position:fixed;left:0;right:0;bottom:0;z-index:6;display:flex;justify-content:center;background:#1c1511;border-top:1px solid #33261f;padding:8px 4px calc(10px + env(safe-area-inset-bottom,0px))}
nav.tabs .in{display:flex;justify-content:space-around;width:100%;max-width:520px}
nav.tabs button{display:flex;flex-direction:column;align-items:center;gap:4px;min-width:60px;min-height:48px;background:none;border:none;color:var(--dim);font-size:12px;font-weight:700;padding:0 2px}
nav.tabs button[aria-selected="true"]{color:var(--gold);font-weight:800}

.focus{position:fixed;inset:0;z-index:20;background:#120d0b;display:flex;flex-direction:column;padding:calc(16px + env(safe-area-inset-top,0px)) 16px calc(24px + env(safe-area-inset-bottom,0px));overflow-y:auto}
.focus .top{display:flex;justify-content:space-between;align-items:center}
.focus .back{width:44px;height:44px;border-radius:12px;background:var(--panel);border:none;display:grid;place-items:center}
.ring{position:relative;width:240px;height:240px;margin:18px auto 0;flex-shrink:0}
.ring .c{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center}
.ring .c b{font-family:var(--display);font-weight:400;font-size:54px;line-height:1;font-variant-numeric:tabular-nums}
.ring .c span{font-size:14px;font-weight:700;color:var(--muted)}
.fstep{text-align:center;padding:16px 8px 0}
.fstep h2{font-family:var(--display);font-weight:400;font-size:24px;margin:0}
.fstep p{margin:6px 0 0;color:#d9c9b9;font-size:15px}
.flist{display:flex;flex-direction:column;gap:2px;margin:16px 8px 0}
.flist div{display:flex;align-items:center;gap:12px;padding:7px 0;font-size:15px;color:var(--muted)}
.flist .dot{width:22px;height:22px;border-radius:50%;border:2px solid var(--line2);flex-shrink:0;display:grid;place-items:center}
.flist .done{color:var(--dim);text-decoration:line-through}.flist .done .dot{background:var(--ok);border-color:var(--ok)}
.flist .cur{color:var(--fg);font-weight:800}.flist .cur .dot{border:3px solid var(--fire)}
.factions{display:flex;flex-direction:column;gap:10px;margin-top:auto;padding-top:18px}
.factions .tip{font-size:13px;color:var(--dim);text-align:center}
.goldbtn{height:60px;border:none;border-radius:18px;background:var(--gold);color:var(--ink);font-weight:800;font-size:18px;width:100%}
.line{height:48px;border-radius:14px;background:transparent;border:1px solid var(--line2);color:#d9c9b9;font-weight:700;font-size:15px;width:100%}

.toast{position:fixed;left:50%;bottom:calc(96px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);z-index:30;background:var(--paper);color:var(--ink);padding:10px 16px;border-radius:12px;font-weight:700;opacity:0;transition:opacity .25s;pointer-events:none;max-width:calc(100% - 32px);text-align:center}

  star:'<svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="#e0a456" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 2l3 6 6 1-4.5 4.5L18 20l-6-3-6 3 1.5-6.5L3 9l6-1z"/></svg>'
};

let state={days:{},body:[],lifts:[]};
let save=()=>{};
let tab="today",confirmPlay=false;

/* ---------- время ---------- */
const pad=n=>String(n).padStart(2,"0");
const fmt=d=>d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate());
const key=()=>fmt(new Date());
const shift=(k,n)=>{const d=new Date(k+"T12:00:00");d.setDate(d.getDate()+n);return fmt(d)};
const dow=k=>new Date(k+"T12:00:00").getDay();
const nowMin=()=>{const n=new Date();return n.getHours()*60+n.getMinutes()};
const toMin=t=>{const[h,m]=String(t).split(":").map(Number);return h*60+m};
const hm=m=>{m=Math.round(m);return pad(Math.floor(m/60)%24)+":"+pad(((m%60)+60)%60)};
const hhmm=()=>hm(nowMin());
const durTxt=m=>m>=60?(Math.floor(m/60)+" ч"+(m%60?" "+(m%60)+" мин":"")):m+" мин";
const esc=s=>String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const $=id=>document.getElementById(id);

/* ---------- данные ---------- */
function norm(s){if(!s||typeof s!=="object")s={};if(!s.days||typeof s.days!=="object")s.days={};if(!Array.isArray(s.body))s.body=[];if(!Array.isArray(s.lifts))s.lifts=[];return s}
function dayOf(k){const d=state.days[k]||(state.days[k]={});d.done=d.done||[];d.at=d.at||{};d.custom=d.custom||[];d.skip=d.skip||[];d.dur=d.dur||{};d.gl=d.gl||[];return d}
const peek=k=>state.days[k];
const has=(d,id)=>!!d&&(d.done||[]).includes(id);
const bossDone=d=>!!d&&BOSS_IDS.every(b=>has(d,b));
const trainOf=k=>prof().gymDays.includes(dow(k))?"gym":null; // дни зала из анкеты
const subOf=q=>BOT&&q.botSub?q.botSub:(q.sub||"");
const locked=q=>BOT&&q.proof;

function queue(k){
  const d=dayOf(k),out=[];
  for(const q of QUESTS){
    if(q.id==="gym"){if(!trainOf(k))continue}
    else if(q.id==="walk"){if(trainOf(k))continue}
    else if(q.days&&!q.days.includes(dow(k)))continue;
    if(q.id==="screen"){out.push({...q,fixed:DAY_END_(),sub:"Отбой в "+BED_()});continue}
    if(q.kind==="video"&&prof().videoMin!==q.dur){out.push({...q,dur:prof().videoMin});continue}
    if(q.id==="_custom"){for(const c of d.custom)out.push({id:c.id,name:c.name,dur:c.dur||30,fixed:c.at||null,xp:15,custom:1});
      if(k===key())for(const c of houseOf().chores)if((choreDue(c,k)||(c.last===k&&has(d,"ch_"+c.id)))&&!d.skip.includes("ch_"+c.id))out.push({id:"ch_"+c.id,name:c.name,sub:"Дом · раз в "+c.every+" дн",dur:c.dur||20,minor:1,chore:1});
      continue}
    const debt=debtOf(k);
    if(q.id==="fine"&&!debt)continue;
    if(q.id==="vid2"){if(debt){out.push({...q,name:"Долг: второе видео",sub:"За вчера. Без него награды и Доты нет",botSub:"За вчера. Ссылку кинь боту",opt:0,penalty:1});continue}if(!bossDone(d))continue}
    if(d.skip.includes(q.id))continue;
    if(q.until&&k===key()&&nowMin()>toMin(q.until)&&!has(d,q.id))continue; // утро прошло: не тащим завтрак в вечер
    out.push(q);
  }
  return out;
}
const isDone=(d,q)=>q.kind==="video"?bossDone(d):has(d,q.id);
function durOf(d,q){
  if(d.dur[q.id])return d.dur[q.id];
  const L=learned()[q.kind==="video"?"video":q.id],base=L?L.min:(q.dur||30);
  if(q.kind==="video"){const left=BOSS_IDS.filter(b=>!has(d,b)).length;return Math.max(20,Math.round(base*left/5))}
  return base;
}

/* ---------- замеры времени ---------- */
// Каждое нажатие пишется в журнал дня (d.ev). Для закрытого дела считаем, сколько оно заняло (d.span).
// План берёт медиану последних замеров, когда их набралось 3.
function logEv(d,e,id){d.ev=(d.ev||[]).concat([[hhmm(),e,id||""]]).slice(-200)}
function restOverlap(d,a,b){return restsOf(d).reduce((n,r)=>{const s=toMin(r.at),e=s+r.min;return n+Math.max(0,Math.min(b,e)-Math.max(a,s))},0)}
function recSpan(d,id){
  const now=nowMin(),isStep=BOSS_IDS.includes(id);
  let s=null,g=1;
  if(d.cur&&(d.cur.id===id||(isStep&&d.cur.id==="video"))){s=toMin(d.cur.at);g=0}
  // последнее событие перед этим: закрытое дело или конец отдыха
  const marks=Object.entries(d.at).filter(([k])=>k!==id).map(([,t])=>toMin(t)).concat(restsOf(d).map(r=>toMin(r.at)+r.min)).filter(t=>t<=now);
  const last=marks.length?Math.max(...marks):null;
  if(last!=null&&(s==null||last>s))s=last;
  if(s==null||s>now)return;
  const m=now-s-restOverlap(d,s,now);
  if(m<1)return;
  d.span=Object.assign({},d.span||{},{[id]:{s:hm(s),e:hm(now),m,g}});
}
const BASE_DUR=Object.fromEntries(QUESTS.filter(q=>q.dur).map(q=>[q.id,q.dur]));
function median(a){const b=a.slice().sort((x,y)=>x-y),n=b.length;return n?(n%2?b[(n-1)/2]:(b[n/2-1]+b[n/2])/2):0}
let _learnKey="",_learn={};
function learned(){
  const ks=Object.keys(state.days).sort().slice(-40),sig=ks.map(k=>k+JSON.stringify(state.days[k].span||{})).join("|");
  if(sig===_learnKey)return _learn;
  const vals={};
  for(const k of ks){const sp=state.days[k].span||{};
    for(const [id,v] of Object.entries(sp)){if(!BASE_DUR[id]||id==="video")continue;
      if(v.g&&v.m>BASE_DUR[id]*2.5)continue; // угаданный старт и слишком долго: скорее был перерыв
      (vals[id]=vals[id]||[]).push(v.m)}
    if(BOSS_IDS.every(b=>sp[b]))(vals.video=vals.video||[]).push(BOSS_IDS.reduce((n,b)=>n+sp[b].m,0));
    for(const b of BOSS_IDS)if(sp[b])(vals[b]=vals[b]||[]).push(sp[b].m);
  }
  const out={};
  for(const [id,arr] of Object.entries(vals)){const last=arr.slice(-10);if(last.length<3)continue;
    const m0=median(last),ok=last.filter(x=>x<=m0*2.5&&x>=m0*0.3);if(ok.length<3)continue;
    out[id]={min:Math.max(5,Math.round(median(ok)/5)*5),n:ok.length}}
  _learnKey=sig;_learn=out;return out;
}

/* ---------- живой план ---------- */
// Раскладывает несделанное от «сейчас»: якоря стоят на месте, остальное обтекает их.
function plan(k,extraGame){
  const d=dayOf(k),now=nowMin(),out=[],over=[];
  const start=d.at.wake?Math.min(now,toMin(d.at.wake)):Math.max(now,toMin(DAY_START_()));
  let cur=Math.max(now,start);
  // идущий отдых
  const rests=restsOf(d).map(r=>({s:toMin(r.at),m:r.min})).filter(r=>r.s+r.m>now).sort((a,b)=>a.s-b.s);
  if(extraGame)rests.push({s:Math.max(now,rests.length?rests[rests.length-1].s+rests[rests.length-1].m:now),m:extraGame});
  for(const r of rests){const s=r.s<=now?r.s:Math.max(r.s,cur);out.push({game:1,start:s,end:s+r.m,now:s<=now});cur=Math.max(cur,s+r.m)}
  const pending=queue(k).filter(q=>!isDone(d,q));
  // начатое дело идёт первым
  const ci=d.cur&&pending.findIndex(q=>q.id===d.cur.id);
  if(ci>=0){const q=pending.splice(ci,1)[0];const s=toMin(d.cur.at);const e=s+durOf(d,q);out.push({q,start:s,end:Math.max(e,now+5),pe:e,started:1,late:now>e?now-e:0,now:1});cur=Math.max(cur,Math.max(e,now+5))}
  const anchors=pending.filter(q=>q.fixed).sort((a,b)=>toMin(a.fixed)-toMin(b.fixed));
  const flex=pending.filter(q=>!q.fixed);
  const end=toMin(DAY_END_());
  const placeAnchor=a=>{const s=Math.max(toMin(a.fixed),cur);if(toMin(a.fixed)>cur&&toMin(a.fixed)-cur>=10)out.push({gap:1,start:cur,end:toMin(a.fixed)});out.push({q:a,start:s,end:s+durOf(d,a),anchor:1,late:Math.max(0,cur-toMin(a.fixed))});cur=s+durOf(d,a)};
  for(const q of flex){
    const du=durOf(d,q);
    while(anchors.length&&toMin(anchors[0].fixed)<cur+du&&anchors[0].fixed!==DAY_END_())placeAnchor(anchors.shift());
    if(cur+du>end){if(!q.opt||q.penalty)over.push({q,dur:du});continue} // бонусы молча не влезают
    out.push({q,start:cur,end:cur+du});cur+=du;
  }
  while(anchors.length)placeAnchor(anchors.shift());
  if(out.length&&!out[0].now&&out[0].start<=now+1)out[0].now=1;
  return {items:out,over};
}

/* ---------- дом ---------- */
// Хозяйство с участниками и должностями. Записи с id и u (время правки), удалённые id в del.
// Бот сливает по u, так что правки из чата и из приложения не теряются.

const MOVE_STEPS=["Найти студию или квартиру с отдельной кухней","Подписать договор аренды","Договориться с хозяином о сдаче комнаты","Сдать комнату и забрать залог €500","Переписать адрес в BRP (gemeente)","Новый адрес: банк, страховка, UWV, RDW (Audi)"];
const DEF_ROLES=[{id:"owner",name:"Создатель",perms:Object.keys(PERMS),fixed:true},{id:"adult",name:"Взрослый",perms:["see_food","edit_food","shop","chores","assign","projects","notes"]},{id:"helper",name:"Помощник",perms:["see_food","shop","chores"]},{id:"guest",name:"Гость",perms:["shop"]}];
function houseOf(){
  let h=state.house;
  if(!h||typeof h!=="object"){h=state.house={id:"house_me",members:[{uid:"me",name:"Андрей",role:"owner",u:0}],roles:DEF_ROLES.map(r=>({...r,u:0})),items:[],shop:[],
    chores:DEF_CHORES.map(c=>({...c,last:key(),u:0})),projects:[{id:"p_move",name:"Переезд до 31.12",due:"2026-12-31",u:0,steps:MOVE_STEPS.map((t,i)=>({id:"s"+(i+1),t,done:false,u:0}))}],del:[],notes:[]}}
  for(const k of ["items","shop","chores","projects","del","notes","members"])if(!Array.isArray(h[k]))h[k]=[];
  if(!Array.isArray(h.roles)||!h.roles.length)h.roles=DEF_ROLES.map(r=>({...r,u:0}));
  return h;
}
const hid=p=>p+Date.now().toString(16)+Math.random().toString(16).slice(2,6);
const touch=x=>{x.u=Date.now();return x};
const addDays=(k,n)=>shift(k,n);
function choreDue(c,k){return !c.last||addDays(c.last,c.every||7)<=k}
const expiringH=h=>h.items.filter(x=>x.cat==="fridge"&&x.level!=="out"&&x.until&&x.until<=addDays(key(),1));
function shopListH(h){const seen=new Set(),out=[];
  for(const x of h.items)if(x.level==="low"||x.level==="out")if(!seen.has(x.name.toLowerCase())){seen.add(x.name.toLowerCase());out.push({kind:"item",x})}
  for(const s of h.shop)if(!s.done&&!seen.has(s.name.toLowerCase())){seen.add(s.name.toLowerCase());out.push({kind:"shop",x:s})}
  return out}
function homeBadge(){const h=houseOf(),k=key();return h.chores.filter(c=>choreDue(c,k)).length+expiringH(h).length+h.items.filter(x=>x.level==="out").length}
function updBadge(){const b=$("homebadge");if(!b)return;const n=homeBadge();b.hidden=!n;b.textContent=n>9?"9+":n}
function hAdd(name,cat){name=name.trim().slice(0,60);if(!name)return;const h=houseOf();cat=cat||guessCat(name);
  const ex=h.items.find(x=>x.cat===cat&&x.name.toLowerCase()===name.toLowerCase());
  const until=cat==="fridge"?addDays(key(),shelfDays(name)):null;
  if(ex){ex.level="ok";if(until)ex.until=until;touch(ex)}else h.items.push(touch({id:hid("i"),name,cat,level:"ok",...(until?{until}:{})}));
  const s=h.shop.find(x=>!x.done&&x.name.toLowerCase()===name.toLowerCase());if(s){s.done=true;touch(s)}}
const ddmm=k=>k?k.slice(8,10)+"."+k.slice(5,7):"";
function daysLeft(k){return Math.round((new Date(k+"T12:00:00")-new Date(key()+"T12:00:00"))/864e5)}

/* ---------- провал и наказания ---------- */
// Провал = день без видео. Считаем только дни, когда приложением уже пользовались.
function failedDay(k){if(k>=key())return false;const d=peek(k);if(bossDone(d))return false;
  return Object.keys(state.days).some(x=>x<=k&&((peek(x).done||[]).length||peek(x).firstSmoke))}
const debtOf=k=>failedDay(shift(k,-1));
const debtClosed=d=>has(d,"vid2")&&has(d,"fine");

/* ---------- награда дня, XP ---------- */
// Главная награда (что именно, задаётся в анкете) открывается, когда закрыты 4 главных дела. Одна за день.
const REQ_NAMES={video:"Видео",train:"Тренировка",cbr:"Теория",eng:"Duolingo",debt:"Долг",fine:"€5"};
function reqs(k){const d=peek(k)||{},at=d.at||{},tr=trainOf(k);
  const r=[{id:"video",t:at.b5},{id:"cbr",t:at.cbr},{id:"eng",t:at.eng}];
  const P=prof().req;
  if(tr&&P.train)r.splice(1,0,{id:"train",tr,t:at[tr]});
  for(const id of ["cbr","eng"])if(!P[id]){const i=r.findIndex(x=>x.id===id);if(i>=0)r.splice(i,1)}
  if(debtOf(k)){r.push({id:"debt",t:at.vid2,pen:1},{id:"fine",t:at.fine,pen:1})}
  if(d.skip)for(const x of r)if(x.id!=="video"&&!x.pen&&d.skip.includes(x.id==="train"?x.tr:x.id))x.t=x.t||"skip"; // убранное сегодня не блокирует награду, видео убрать нельзя
  return r}
// pending: копим · open: награда открыта · gold: взял после всех дел · base: раньше, но тренировка была чистой · broken: раньше тренировки
function rewardState(k){
  const d=peek(k);if(!d)return "pending";
  const R=reqs(k),fs=d.firstSmoke,all=R.every(x=>x.t);
  const tr=R.find(x=>x.id==="train");
  if(!fs){if(all)return k<key()?"gold":"open";return k<key()&&(d.done||[]).length?"base":"pending"}
  if(all&&R.every(x=>x.t==="skip"||x.t<=fs))return "gold";
  if(tr?(tr.t&&tr.t!=="skip"&&tr.t<=fs):(R[0].t&&R[0].t<=fs))return "base";
  return "broken";
}
const cleanState=rewardState;
const isClean=k=>["base","gold","open"].includes(rewardState(k));
function cleanStreak(){let n=0,k=key();if(!isClean(k))k=shift(k,-1);
  for(let i=0;i<400;i++){if(isClean(k)){n++;k=shift(k,-1)}else break}return n}
const gamesUsed=d=>Math.max(d.games||0,(d.gl||[]).length);
const vids=()=>Object.values(state.days).reduce((a,d)=>a+(bossDone(d)?1:0)+(has(d,"vid2")?1:0),0);
function videoStreak(){let n=0,k=key();if(!bossDone(peek(k)))k=shift(k,-1);while(bossDone(peek(k))){n++;k=shift(k,-1)}return n}
const countQ=(ids,days)=>{let n=0;const keys=days?Array.from({length:days},(_,i)=>shift(key(),-i)):Object.keys(state.days);for(const k of keys){const d=peek(k);if(d&&ids.some(id=>has(d,id)))n++}return n};
const e1rm=l=>l.kg*(1+(l.reps||1)/30);
const liftsOf=ex=>state.lifts.filter(l=>l.ex===ex);

/* ---------- лестница наград ---------- */
// Серия: подарки внутри одной серии дней с видео. Большие цели: разовые, за реальный результат.
const RUNGS=[{id:"s3",n:3,budget:5,t:"3 дня подряд"},{id:"s7",n:7,budget:15,t:"7 дней подряд"},{id:"s14",n:14,budget:30,t:"14 дней подряд"},{id:"s30",n:30,budget:50,t:"30 дней подряд"}];

const GOALS=[
  {id:"g_sub100",t:"100 подписчиков",grp:"Канал",budget:25,ok:G=>(G.subs||0)>=100,prog:G=>`${G.subs||0} / 100`},

  {id:"g_sub1000",t:"1000 подписчиков",grp:"Канал",budget:150,ok:G=>(G.subs||0)>=1000,prog:G=>`${G.subs||0} / 1000`},

  {id:"g_license",t:"Получил права",grp:"Жизнь",budget:200,ok:G=>!!G.license,flag:"license"},
  {id:"g_weight",t:"Цель по весу",grp:"Жизнь",budget:50,ok:G=>!!G.goalKg&&curKg()!=null&&(G.goalKg<=G.startKg?curKg()<=G.goalKg:curKg()>=G.goalKg),prog:G=>G.goalKg?`${curKg()??"?"} → ${G.goalKg} кг`:"цель не задана"},

];
const goalsSt=()=>state.goals||{};
function streakStart(){const n=videoStreak();if(!n)return null;let k=key();if(!bossDone(peek(k)))k=shift(k,-1);return shift(k,-(n-1))}
function bestStreak(){let best=0,run=0;const ks=Object.keys(state.days).sort();if(!ks.length)return 0;let k=ks[0];const end=key();
  while(k<=end){if(bossDone(peek(k))){run++;best=Math.max(best,run)}else if(k<end)run=0;k=shift(k,1)}return best}
const claimKey=r=>r.n?r.id+"@"+streakStart():r.id;
const rungOpen=r=>r.n?videoStreak()>=r.n:r.ok(goalsSt());
const rungClaimed=r=>!!(state.claims||{})[claimKey(r)];
const openList=()=>RUNGS.concat(GOALS).filter(r=>rungOpen(r)&&!rungClaimed(r)).map(r=>r.id);
const findRung=id=>RUNGS.concat(GOALS).find(r=>r.id===id);

function toast(t){const el=$("toast");el.textContent=t;el.classList.add("show");clearTimeout(toast.h);toast.h=setTimeout(()=>el.classList.remove("show"),2600)}
function haptic(t){try{window.Telegram&&Telegram.WebApp.HapticFeedback.notificationOccurred(t)}catch(e){}}

function mutate(fn){
  const before=new Set(openList());
  const k=key(),wasBoss=bossDone(peek(k)),wasClean=cleanState(k);
  fn();
  const d=peek(k);let delay=0;
  if(!wasBoss&&bossDone(d)){toast("Видео вышло. Засчитано для награды.");haptic("success");delay=2700}
  const c=rewardState(k);
  if(c!==wasClean){const T={open:"Все 4 дела закрыты. Награда открыта.",gold:"Заслужил.",base:"Раньше времени, но тренировка была чистой.",broken:"Раньше тренировки. Награда сегодня сгорела."}[c];if(T)setTimeout(()=>toast(T),delay)}
  const fresh=openList().filter(id=>!before.has(id));
  if(fresh.length){const r=findRung(fresh[0]),g=(state.gifts||{})[r.id];setTimeout(()=>toast(`Открыт подарок: ${r.t}!${g?" "+g:""}`),delay+2700);haptic("success")}
  render();save();
}
function findQ(id){if(String(id).startsWith("ch_"))return queue(key()).find(x=>x.id===id);return QUESTS.find(x=>x.id===id)||VIDEO_STEPS.find(x=>x.id===id)||dayOf(key()).custom.find(c=>c.id===id)}
function toggle(id){
  const q=findQ(id),d=dayOf(key());
  if(q&&locked(q)&&!has(d,id)){toast("Это закрывается пруфом. Кинь его боту.");haptic("warning");return}
  mutate(()=>{const i=d.done.indexOf(id);
    if(i>=0){if(q&&locked(q))return;d.done.splice(i,1);delete d.at[id];if(d.span)delete d.span[id];logEv(d,"undo",id);
      if(id.startsWith("ch_")){const c=houseOf().chores.find(x=>"ch_"+x.id===id);if(c){c.last=(d.chPrev||{})[id]||null;c.u=Date.now()}}}
    else{recSpan(d,id);d.done.push(id);d.at[id]=hhmm();logEv(d,"done",id);
      if(id.startsWith("ch_")){const c=houseOf().chores.find(x=>"ch_"+x.id===id);if(c){d.chPrev=Object.assign({},d.chPrev,{[id]:c.last});c.last=key();c.u=Date.now()}}if(d.cur&&(d.cur.id===id||(d.cur.id==="video"&&bossDone(d))))delete d.cur}});
}
function startTask(id){const d=dayOf(key());mutate(()=>{d.cur={id,at:hhmm()};logEv(d,"start",id)});const q=findQ(id);if(q)toast("Начал: "+q.name+". Остальное сдвинулось")}
const nextStep=d=>VIDEO_STEPS.find(s=>!has(d,s.id));

/* ---------- отрисовка ---------- */
const FIRE='<svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M12 22c4.4 0 7.5-3 7.5-7.2 0-4.1-2.8-6.3-4.2-10.3-1.9 1.7-3 3.6-3.1 5.8-.9-1-1.6-2.2-1.8-3.9C7.4 8.4 4.5 11.3 4.5 14.8 4.5 19 7.6 22 12 22z"/></svg>';
const TITLES={today:"Сегодня",chan:"Канал",home:"Дом",me:"Я"};
function renderReward(){
  const k=key(),d=dayOf(k),R=reqs(k),st=rewardState(k),n=R.filter(x=>x.t).length,vs=videoStreak();
  const sub=tab==="today"?new Date().toLocaleDateString("ru-RU",{weekday:"long",day:"numeric",month:"long"}):"";
  const leafTxt=st==="open"||st==="gold"?IC.check:`${n}/${R.length}`;
  $("appbar").innerHTML=`<div class="tt"><h1>${TITLES[tab]}</h1>${sub?`<span class="sub">${esc(sub)}</span>`:""}</div>
    <div class="pills"><button type="button" class="pill fire${vs?"":" zero"}" data-tab-go="me" data-meseg="prog" aria-label="Серия ${vs} дней">${FIRE}${vs}</button>
    <button type="button" class="pill leaf${st==="open"||st==="gold"?" open":""}${debtOf(k)&&!debtClosed(d)?" pen":""}" id="rewardpill" aria-label="Награда дня">${IC.leaf}${leafTxt}</button></div>`;
  if(!confirmPlay){$("confirm").innerHTML="";return}
  const a=plan(k),b=plan(k,restMin),nextReal=b.items.find(x=>x.q&&!x.started),newly=b.over.filter(o=>!a.over.some(x=>x.q.id===o.q.id));
  const done=restToday(d);
  $("confirm").innerHTML=`<section class="confirm"><b style="font-size:16px">Отдых: ${hhmm()}–${hm(nowMin()+restMin)}</b>
    <div class="opts" style="grid-template-columns:repeat(4,minmax(0,1fr))">${[30,45,60,90].map(m=>`<button type="button" class="opt" data-rm="${m}" aria-pressed="${m===restMin}">${durTxt(m)}</button>`).join("")}</div>
    <p>${nextReal?`Дальше всё сдвинется. «${esc(nextReal.q.name)}» начнётся в ${hm(nextReal.start)}.`:"После отдыха дел не осталось."}${done?` Сегодня уже отдыхал ${durTxt(done)}.`:""}</p>
    ${done+restMin>150?`<p class="warn">Это будет больше 2.5 часов отдыха за день.</p>`:""}
    ${newly.length?`<p class="warn">Не влезет до отбоя: ${newly.map(o=>esc(o.q.name)).join(", ")}.</p>`:""}
    <div class="btns"><button type="button" id="nogame">Не сейчас</button><button type="button" class="pri" id="gogame">Отдыхаю</button></div></section>`;
  $("confirm").querySelectorAll("[data-rm]").forEach(b=>b.onclick=()=>{restMin=+b.dataset.rm;render()});
  $("nogame").onclick=()=>{confirmPlay=false;render()};
  $("gogame").onclick=()=>{confirmPlay=false;const m=restMin;mutate(()=>{d.gl.push({at:hhmm(),min:m});d.games=gamesUsed(d);logEv(d,"rest",String(m))});toast(`Отдых ${durTxt(m)}. Таймер пошёл.`)};
}
function askGame(){const d=dayOf(key());if(debtOf(key())&&!debtClosed(d)){toast("Штрафной день: отдых после долга и штрафа.");return}confirmPlay=true;render();window.scrollTo(0,0)}
function endRest(){const d=dayOf(key()),r=restsOf(d),now=nowMin();const i=r.findIndex(x=>toMin(x.at)<=now&&toMin(x.at)+x.min>now);if(i<0)return;
  r[i]={at:r[i].at,min:Math.max(1,now-toMin(r[i].at))};mutate(()=>{d.gl=r});toast("Отдых закончен. Дальше по плану.")}
function renderHead(){
  $("daybar").hidden=tab!=="today";
  // полоса дня: от сейчас до отбоя
  const now=nowMin(),bed=bedMin(),span=Math.max(1,bed-now),p=plan(key());
  const free=p.items.filter(i=>i.gap).reduce((a,i)=>a+Math.max(0,i.end-Math.max(i.start,now)),0),miss=p.over.reduce((a,o)=>a+o.dur,0);
  let segs="",total=0;
  for(const i of p.items){const st=Math.max(i.start,now),en=Math.min(i.end,bed);if(en<=st)continue;const w=(en-st)/span*100;total+=en-st;
    const c=i.gap?"f":i.game?"g":i.q&&i.q.kind==="video"?"v":i.anchor?"a":"t";segs+=`<i class="${c}" style="width:${w.toFixed(2)}%" title="${esc(i.gap?"Свободно":i.game?"Отдых":i.q.name)}"></i>`}
  if(miss)segs+=`<i class="o" style="width:${Math.min(30,miss/span*100).toFixed(2)}%"></i>`;
  $("daybar").innerHTML=`<div class="track" role="img" aria-label="План до отбоя">${segs}</div>
    <div class="dline">${miss?`<span class="minus">Не хватает <b>${durTxt(miss)}</b></span>`:`<span class="free">Свободно <b>${durTxt(free)}</b></span>`}<span>До отбоя <b>${durTxt(Math.max(0,bed-now))}</b></span></div>`;

}
function nowCard(k,d,p){
  const it=p.items[0],now=nowMin();
  if(!it)return `<section class="now free"><span class="k">День закрыт</span><h2>Всё сделано</h2><p>Свободное время до ${DAY_END_()}. Потом экран выкл.</p><button type="button" class="ghost" data-game="1">Отдохнуть</button></section>`;

  const q=it.q,late=it.late>0,left=it.end-now;

      <button type="button" class="bigbtn" data-focus="1">${IC.play}${it.started?"Открыть фокус":"Начать фокус 50 минут"}</button>${step}</section>`;
  }

function planRow(d,it,opts={}){

  const sub=q.kind==="video"?`${BOSS_IDS.filter(b=>has(d,b)).length} из 5 шагов · ${durTxt(durOf(d,q))}`:(it.late&&it.started?`Сверх плана ${it.late} мин`:subOf(q));

const WORK=50*60,BREAK=10*60;
let F={phase:"work",endsAt:0,left:WORK,running:false,session:1},tick=null;
function loadF(){try{const v=JSON.parse(localStorage.getItem("qd-focus")||"null");if(v&&v.day===key())F=Object.assign(F,v)}catch(e){}}
function saveF(){try{localStorage.setItem("qd-focus",JSON.stringify(Object.assign({day:key()},F)))}catch(e){}}
const remain=()=>F.running?Math.max(0,Math.round((F.endsAt-Date.now())/1000)):F.left;
function openFocus(){loadF();const d=dayOf(key());
  if(!d.cur||d.cur.id!=="video")mutate(()=>{d.cur={id:"video",at:hhmm()}});
  if(!F.running&&F.left===WORK&&F.phase==="work"){F.running=true;F.endsAt=Date.now()+WORK*1000}
  saveF();$("focus").hidden=false;document.body.style.overflow="hidden";renderFocus();clearInterval(tick);tick=setInterval(stepTimer,1000)}
function closeFocus(){$("focus").hidden=true;document.body.style.overflow="";clearInterval(tick);render()}
function stepTimer(){
  if(F.running&&remain()<=0){
    if(F.phase==="work"){F.phase="break";F.endsAt=Date.now()+BREAK*1000;toast("50 минут есть. Перерыв 10 минут, без Доты.");haptic("success")}
    else{F.phase="work";F.session++;F.endsAt=Date.now()+WORK*1000;toast("Перерыв всё. Сессия "+F.session+".");haptic("warning")}
    saveF();}
  renderFocus(true);
}
function renderFocus(onlyTime){
  const s=remain(),mm=pad(Math.floor(s/60)),ss=pad(s%60),tot=F.phase==="work"?WORK:BREAK,C=2*Math.PI*104,off=C*(1-s/tot);
  if(onlyTime&&$("ftime")){$("ftime").textContent=mm+":"+ss;$("farc").setAttribute("stroke-dashoffset",off.toFixed(1));return}
  const d=dayOf(key()),st=nextStep(d);
  const list=VIDEO_STEPS.map(x=>`<div class="${has(d,x.id)?"done":x===st?"cur":""}"><span class="dot">${has(d,x.id)?IC.check:""}</span>${esc(x.name)}</div>`).join("");
  const main=!st?`<button type="button" class="goldbtn" id="fclose2">Видео вышло. Закрыть</button>`:locked(st)?`<button type="button" class="goldbtn" data-proof="1">Кинуть ссылку боту</button>`:`<button type="button" class="goldbtn" data-t="${st.id}">Готово, следующий шаг</button>`;
  $("focus").innerHTML=`<div class="top"><button type="button" class="back" id="fclose" aria-label="Назад">${IC.back}</button><span style="font-size:14px;font-weight:800;color:var(--muted)">${F.phase==="work"?"Сессия "+F.session:"Перерыв"}</span><span style="width:44px"></span></div>
    <div class="ring"><svg width="240" height="240" viewBox="0 0 240 240" role="img" aria-label="Осталось ${mm} минут"><circle cx="120" cy="120" r="104" fill="none" stroke="#2a1d16" stroke-width="12"/><circle id="farc" cx="120" cy="120" r="104" fill="none" stroke="${F.phase==="work"?"#e5603f":"#6c9a7d"}" stroke-width="12" stroke-linecap="round" stroke-dasharray="${C.toFixed(1)}" stroke-dashoffset="${off.toFixed(1)}" transform="rotate(-90 120 120)"/></svg>
      <div class="c"><b id="ftime">${mm}:${ss}</b><span>${F.phase==="work"?(F.running?"до перерыва":"на паузе"):"отдых"}</span></div></div>
    <div class="fstep"><h2>${st?esc(st.name):"Видео готово"}</h2><p>${st?esc(BOT&&st.botHint?st.botHint:st.hint):"Красавчик. Видео в зачёт награды."}</p></div>
    <div class="flist">${list}</div>
    <div class="factions"><span class="tip">Телефон экраном вниз. Дота подождёт до загрузки.</span>${main}<button type="button" class="line" id="fpause">${F.running?"Пауза":"Продолжить"}</button></div>`;
  $("fclose").onclick=closeFocus;if($("fclose2"))$("fclose2").onclick=closeFocus;
  $("fpause").onclick=()=>{if(F.running){F.left=remain();F.running=false}else{F.running=true;F.endsAt=Date.now()+F.left*1000}saveF();renderFocus()};
}
