<!doctype html>
<html lang="ru"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<script>window.QD_MODE="bot"</script>
<title>Квест дня</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Russo+One&family=Manrope:wght@500;600;700;800&display=swap">
<style>
/* Один тёмный вид (боевой пропуск): бронза и огонь. Тема намеренно одна. */
:root{
  --bg:#17110e; --panel:#201712; --panel2:#2a1a12; --line:#3a2b22; --line2:#4a3426;
  --fg:#f3e9dd; --muted:#b3a193; --dim:#8e7c6d;
  --gold:#e0a456; --fire:#e5603f; --fire2:#f08a5d; --ok:#6c9a7d; --okl:#7fc79c; --red:#e0705a;
  --paper:#f3e9dd; --ink:#1d1410; --rust:#8a4b1c; --paperline:#e9c3a8;
  --display:"Russo One","Manrope",system-ui,sans-serif;
  --body:"Manrope",system-ui,-apple-system,"Segoe UI",sans-serif;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{background:var(--bg)}
body{color:var(--fg);font:15px/1.45 var(--body);margin:0}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
[hidden]{display:none!important}
.app{max-width:520px;margin:0 auto;padding-bottom:calc(88px + env(safe-area-inset-bottom,0px))}

.reward{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;display:flex;align-items:center;gap:10px;padding:12px 16px;background:var(--panel2);border-bottom:1px solid var(--line2)}
.reward .lbl{font-weight:800;font-size:14px;white-space:nowrap}
.pips{flex:1;display:grid;gap:4px;min-width:0}
.pip{height:8px;border-radius:4px;background:var(--line2)}
.pip.on{background:var(--gold)}.pip.used{background:#7a5a37}
.pip.bonus{background:transparent;border:1px dashed var(--line2)}.pip.bonus.on{background:var(--fire2);border-color:var(--fire2)}
.playbtn{border:none;border-radius:10px;background:var(--gold);color:var(--ink);font-weight:800;font-size:13px;padding:8px 12px;min-height:36px;white-space:nowrap}
.playbtn:disabled{background:var(--line2);color:var(--dim);cursor:not-allowed}
.confirm{margin:12px 16px 0;padding:14px;border-radius:16px;background:var(--panel2);border:1px solid var(--gold);display:flex;flex-direction:column;gap:10px}
.confirm p{margin:0;font-size:14px;color:#d9c9b9}
.confirm .warn{color:var(--red);font-weight:700}
.btns{display:flex;gap:8px}
.btns button{flex:1;height:46px;border-radius:12px;font-weight:800;border:1px solid var(--line2);background:transparent}
.btns .pri{background:var(--gold);color:var(--ink);border-color:var(--gold)}

.head{display:flex;justify-content:space-between;gap:12px;padding:16px 20px 12px}
.hl{display:flex;flex-direction:column;gap:2px;min-width:0}
.hl span{font-size:13px;font-weight:700;color:var(--muted)}
.daybar{margin:0 16px 14px;display:flex;flex-direction:column;gap:6px}
.track{display:flex;height:12px;border-radius:6px;overflow:hidden;background:var(--line)}
.track i{display:block;height:100%;border-right:2px solid var(--bg)}
.track .t{background:#5a4131}.track .v{background:var(--fire)}.track .g{background:var(--gold)}.track .f{background:#2f4a3b}.track .o{background:var(--red)}.track .a{background:#3a2b22}
.dline{display:flex;justify-content:space-between;gap:8px;font-size:13px;font-weight:700;color:var(--muted)}
.dline b{color:var(--fg);font-variant-numeric:tabular-nums}
.dline .free b{color:var(--okl)}.dline .minus b{color:var(--red)}
.head h1{font-family:var(--display);font-weight:400;font-size:24px;margin:0;text-transform:capitalize}
.head{align-items:center}
.plus{width:48px;height:48px;border-radius:50%;border:none;background:var(--gold);color:var(--ink);display:grid;place-items:center;flex-shrink:0;box-shadow:0 4px 16px rgba(224,164,86,.25)}
.stat b{font-family:var(--display);font-weight:400;font-size:16px;color:var(--fg);font-variant-numeric:tabular-nums}
/* окошки добавления */
.sheet{position:fixed;inset:0;z-index:25;display:flex;flex-direction:column;justify-content:flex-end;background:rgba(10,7,5,.6)}
.sheet .pnl{background:var(--panel2);border-radius:22px 22px 0 0;border-top:1px solid var(--line2);padding:16px 16px calc(20px + env(safe-area-inset-bottom,0px));max-width:520px;width:100%;margin:0 auto;display:flex;flex-direction:column;gap:14px;max-height:88vh;overflow-y:auto}
.sheet .sbar{display:flex;align-items:center;justify-content:space-between;gap:8px}
.sheet .dots{display:flex;gap:6px}
.sheet .dots i{width:22px;height:5px;border-radius:3px;background:var(--line2)}
.sheet .dots i.on{background:var(--gold)}
.sheet h2{font-family:var(--display);font-weight:400;font-size:22px;margin:0}
.sheet .q{font-size:14px;color:var(--muted);margin:-8px 0 0}
.sheet input{height:52px;border-radius:14px;border:1px solid var(--line2);background:var(--bg);padding:0 14px;color:var(--fg);font-size:17px;width:100%}
.opts{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.opts.three{grid-template-columns:repeat(3,minmax(0,1fr))}
.opt{min-height:52px;border-radius:14px;border:1px solid var(--line2);background:var(--panel);font-weight:700;font-size:15px;padding:8px;text-align:center}
.opt small{display:block;font-size:12px;font-weight:600;color:var(--muted)}
.opt[aria-pressed="true"]{border-color:var(--gold);background:#3a2416;color:var(--gold)}
.menu{display:flex;flex-direction:column;gap:8px}
.menu .opt{display:flex;align-items:center;gap:12px;text-align:left;padding:12px 14px}
.sum{padding:12px 14px;border-radius:14px;background:var(--panel);font-size:14px;color:#d9c9b9}

.now{margin:0 16px;padding:18px 16px;border-radius:22px;background:var(--paper);color:var(--ink);display:flex;flex-direction:column;gap:12px}
.now .k{display:flex;justify-content:space-between;gap:8px;font-size:13px;font-weight:800;color:var(--rust)}
.now h2{font-family:var(--display);font-weight:400;font-size:26px;line-height:1.1;margin:0}
.now p{margin:4px 0 0;font-size:14px;color:#5a4436}
.clock{display:flex;align-items:baseline;gap:10px}
.clock b{font-family:var(--display);font-weight:400;font-size:40px;line-height:1;font-variant-numeric:tabular-nums}
.clock span{font-size:14px;font-weight:700;color:#5a4436}
.now.late{background:#f6ddd3}.now.late .clock b,.now.late .k{color:#b0391f}
.now.free{background:var(--panel);color:var(--fg);border:1px solid var(--line2)}
.now.free .k{color:var(--gold)}.now.free p{color:var(--muted)}
.segs{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:4px}
.seg{height:6px;border-radius:3px;background:var(--paperline)}.seg.on{background:var(--fire)}
.bigbtn{height:56px;border:none;border-radius:16px;background:var(--ink);color:var(--paper);font-weight:800;font-size:17px;display:flex;align-items:center;justify-content:center;gap:10px;width:100%}
.ghost{height:46px;border-radius:14px;background:transparent;border:1px solid #cdb39c;color:var(--ink);font-weight:700;font-size:15px;width:100%}
.now.free .ghost{border-color:var(--line2);color:var(--fg)}

.clean{margin:12px 16px 0;padding:10px 12px;border-radius:16px;background:var(--panel);border:1px solid var(--line2);display:flex;align-items:center;gap:12px}
.clean.base{border-color:#3c6b52}.clean.gold{border-color:var(--gold);background:#2a2014}.clean.broken{border-color:#6b3a2a}
.clean .txt{flex:1;min-width:0;display:flex;flex-direction:column}
.clean .t{font-size:14px;font-weight:800}
.clean small{font-size:12px;color:var(--muted)}
.smallbtn{border-radius:10px;border:1px solid var(--line2);background:transparent;font-weight:700;font-size:13px;padding:8px 10px;min-height:40px;white-space:nowrap}

.sec{display:flex;justify-content:space-between;align-items:baseline;padding:18px 20px 8px}
.sec h3{margin:0;font-size:15px;font-weight:800}
.sec span,.sec button{font-size:13px;font-weight:700;color:var(--muted);background:none;border:none;padding:0}
.list{display:flex;flex-direction:column;gap:6px;padding:0 16px}
.row{display:flex;align-items:center;gap:12px;padding:10px 12px;border-radius:14px;background:var(--panel);border:1px solid transparent;text-align:left;width:100%;min-height:54px}
.row .tm{width:50px;flex-shrink:0;display:flex;flex-direction:column;font-size:13px;font-weight:800;font-variant-numeric:tabular-nums;line-height:1.2}
.row .tm small{font-size:11px;font-weight:600;color:var(--dim)}
.row .nm{flex:1;min-width:0;display:flex;flex-direction:column}
.row .nm b{font-size:15px;font-weight:700}
.row .nm small{font-size:12px;color:var(--muted)}
.row .chk{width:26px;height:26px;flex-shrink:0;border-radius:8px;border:2px solid var(--line2);display:grid;place-items:center}
.row.on{opacity:.7}.row.on .chk{background:var(--ok);border-color:var(--ok)}
.row.on .nm b{color:var(--dim);text-decoration:line-through}
.row.boss{background:var(--panel2);border-color:var(--fire)}
.row.game{background:#2a2014;border-color:var(--gold)}
.row.anchor{border-color:var(--line2)}
.row.gap{background:transparent;border:1px dashed var(--line);min-height:40px;padding:8px 12px}
.row.gap .nm b{font-size:13px;color:var(--dim);font-weight:700}
.pin{font-size:11px;font-weight:800;color:var(--gold);margin-left:6px}
.tok{width:24px;height:24px;flex-shrink:0;border-radius:50%;border:2px dashed var(--gold);color:var(--gold);display:grid;place-items:center;font-family:var(--display);font-size:10px}
.row.on .tok{background:var(--gold);border-style:solid;color:var(--ink)}
.dur{font-size:12px;font-weight:700;color:var(--dim);white-space:nowrap}
.x{width:36px;height:36px;border-radius:10px;border:none;background:transparent;color:var(--dim);display:grid;place-items:center;flex-shrink:0}
.grp{font-size:13px;font-weight:800;color:var(--muted);padding:10px 4px 2px}
.over{margin:12px 16px 0;padding:12px 14px;border-radius:16px;border:1px solid var(--red);background:#2a1712;display:flex;flex-direction:column;gap:10px}
.over h3{margin:0;font-size:15px;color:var(--red)}
.over .it{display:flex;align-items:center;gap:8px}
.over .it b{flex:1;min-width:0;font-size:14px}
.chip{border-radius:10px;border:1px solid var(--line2);background:transparent;font-size:13px;font-weight:700;padding:6px 10px;min-height:36px}

.add{display:flex;flex-direction:column;gap:8px;margin:10px 16px 0;padding:12px;border-radius:16px;background:var(--panel)}
.add .r{display:flex;gap:8px}
.add input,.add select{min-width:0;height:44px;border-radius:12px;border:1px solid var(--line2);background:var(--bg);padding:0 10px;color:var(--fg)}
.add input[name=t]{flex:1}
.add input::placeholder{color:var(--dim)}
.add .lab{font-size:12px;color:var(--muted);font-weight:700}
.add button{height:44px;border-radius:12px;border:none;background:var(--gold);color:var(--ink);font-weight:800;padding:0 16px}

.card{margin:0 16px;padding:14px;border-radius:18px;background:var(--panel);display:flex;flex-direction:column;gap:10px}
.bars{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:6px;align-items:end;height:110px}
.bar{display:flex;flex-direction:column;align-items:center;justify-content:flex-end;gap:4px;height:100%}
.bar i{display:block;width:100%;border-radius:6px;background:var(--line2);min-height:4px}
.bar.vid i{background:var(--fire)}.bar.today i{outline:2px solid var(--gold);outline-offset:2px}
.bar span{font-size:11px;color:var(--muted);font-weight:700}
.tiles{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px;margin:10px 16px 0}
.tile{padding:12px 14px;border-radius:16px;background:var(--panel);display:flex;flex-direction:column;gap:2px}
.tile b{font-family:var(--display);font-weight:400;font-size:26px;font-variant-numeric:tabular-nums}
.tile span{font-size:13px;color:var(--muted);font-weight:600}
.medal{display:flex;align-items:center;gap:14px}
.medal .m{width:58px;height:58px;border-radius:50%;border:3px solid var(--gold);display:grid;place-items:center;font-family:var(--display);font-size:20px;color:var(--gold);flex-shrink:0}
.ach{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px 8px;padding:0 16px}
.a{display:flex;flex-direction:column;align-items:center;gap:6px;text-align:center}
.a .ic{width:58px;height:58px;border-radius:16px;background:var(--panel);border:2px dashed var(--line2);display:grid;place-items:center}
.a.got .ic{background:#3a2416;border:2px solid var(--gold)}
.a span{font-size:11px;font-weight:700;line-height:1.2;color:var(--dim)}.a.got span{color:var(--fg)}
.mini{display:flex;flex-direction:column;gap:4px;font-size:14px}
.mini div{display:flex;justify-content:space-between;gap:8px;color:var(--muted)}
.mini b{color:var(--fg);font-weight:700;font-variant-numeric:tabular-nums}
.big{font-family:var(--display);font-weight:400;font-size:30px;font-variant-numeric:tabular-nums}
.ex{display:flex;flex-direction:column;gap:6px}
.ex .top{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.ex .top b{font-size:16px}
.ex .top span{font-size:13px;font-weight:700;color:var(--okl)}
.pr{font-size:12px;font-weight:800;color:var(--gold)}
.empty{font-size:13px;color:var(--dim);margin:0}

nav.tabs{position:fixed;left:0;right:0;bottom:0;z-index:6;display:flex;justify-content:center;background:#1c1511;border-top:1px solid #33261f;padding:8px 4px calc(10px + env(safe-area-inset-bottom,0px))}
nav.tabs .in{display:flex;justify-content:space-around;width:100%;max-width:520px}
nav.tabs button{display:flex;flex-direction:column;align-items:center;gap:4px;min-width:64px;min-height:48px;background:none;border:none;color:var(--dim);font-size:12px;font-weight:700}
nav.tabs button[aria-selected="true"]{color:var(--gold);font-weight:800}

.focus{position:fixed;inset:0;z-index:20;background:#120d0b;display:flex;flex-direction:column;padding:calc(16px + env(safe-area-inset-top,0px)) 16px calc(24px + env(safe-area-inset-bottom,0px));overflow-y:auto}
.focus .top{display:flex;justify-content:space-between;align-items:center}
.focus .back{width:44px;height:44px;border-radius:12px;background:var(--panel);border:none;display:grid;place-items:center}
.ring{position:relative;width:240px;height:240px;margin:18px auto 0;flex-shrink:0}
.ring .c{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center}
.ring .c b{font-family:var(--display);font-weight:400;font-size:54px;line-height:1;font-variant-numeric:tabular-nums}
.ring .c span{font-size:14px;font-weight:700;color:var(--muted)}
.fstep{text-align:center;padding:16px 8px 0}
.fstep h2{font-family:var(--display);font-weight:400;font-size:24px;margin:0}
.fstep p{margin:6px 0 0;color:#d9c9b9;font-size:15px}
.flist{display:flex;flex-direction:column;gap:2px;margin:16px 8px 0}
.flist div{display:flex;align-items:center;gap:12px;padding:7px 0;font-size:15px;color:var(--muted)}
.flist .dot{width:22px;height:22px;border-radius:50%;border:2px solid var(--line2);flex-shrink:0;display:grid;place-items:center}
.flist .done{color:var(--dim);text-decoration:line-through}.flist .done .dot{background:var(--ok);border-color:var(--ok)}
.flist .cur{color:var(--fg);font-weight:800}.flist .cur .dot{border:3px solid var(--fire)}
.factions{display:flex;flex-direction:column;gap:10px;margin-top:auto;padding-top:18px}
.factions .tip{font-size:13px;color:var(--dim);text-align:center}
.goldbtn{height:60px;border:none;border-radius:18px;background:var(--gold);color:var(--ink);font-weight:800;font-size:18px;width:100%}
.line{height:48px;border-radius:14px;background:transparent;border:1px solid var(--line2);color:#d9c9b9;font-weight:700;font-size:15px;width:100%}

.toast{position:fixed;left:50%;bottom:calc(96px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);z-index:30;background:var(--paper);color:var(--ink);padding:10px 16px;border-radius:12px;font-weight:700;opacity:0;transition:opacity .25s;pointer-events:none;max-width:calc(100% - 32px);text-align:center}
.toast.show{opacity:1}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

</head><body>
<div class="app">
  <div class="reward" id="reward"></div>
  <div id="confirm"></div>
  <div class="head"><div class="hl"><h1 id="day"></h1><span id="lvl"></span></div><button type="button" class="plus" id="plus" aria-label="Добавить"><svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg></button></div>
  <div class="daybar" id="daybar"></div>
  <main id="view"></main>
</div>

<nav class="tabs" aria-label="Разделы"><div class="in" role="tablist">
  <button type="button" role="tab" data-tab="today" aria-selected="true"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 2l3 6 6 1-4.5 4.5L18 20l-6-3-6 3 1.5-6.5L3 9l6-1z"/></svg>Сегодня</button>
  <button type="button" role="tab" data-tab="day" aria-selected="false"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg>День</button>
  <button type="button" role="tab" data-tab="gym" aria-selected="false"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 5v14M18 5v14M6 12h12M3 8v8M21 8v8"/></svg>Зал</button>
  <button type="button" role="tab" data-tab="prog" aria-selected="false"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 20V10M10 20V4M16 20v-7M22 20H2"/></svg>Прогресс</button>
</div></nav>

<div class="focus" id="focus" hidden></div>
<div class="sheet" id="sheet" hidden></div>
<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script>
const MODE=window.QD_MODE||"artifact";const BOT=MODE==="bot";
const GAME_MIN=45, DAY_START="08:00", DAY_END="22:45";

const VIDEO_STEPS=[
  {id:"b1",name:"Текст в ChatGPT",hint:"Попроси историю и скопируй текст целиком."},
  {id:"b2",name:"Озвучка в ElevenLabs",hint:"Вставь текст, сгенерируй и скачай mp3."},
  {id:"b3",name:"Картинка и анимация",hint:"Сделай картинку и оживи её."},
  {id:"b4",name:"Субтитры",hint:"Сгенерируй субтитры и проверь первые минуты."},
  {id:"b5",name:"Загрузка на YouTube",hint:"Название, превью, публикация.",botHint:"Название, превью, публикация. Ссылку кинь боту.",proof:1}
];
// dur в минутах. fixed = якорь (время не двигается). days: 0 вс ... 6 сб.
const QUESTS=[
  {id:"wake",name:"Подъём, вода, улица",sub:"10 минут дневного света",dur:20,xp:20,minor:1,until:"12:00"},
  {id:"bfast",name:"Завтрак",sub:"Разогреть заготовку",dur:20,xp:15,minor:1,until:"12:00"},
  {id:"cbr",name:"Теория CBR",sub:"Глава и тест",botSub:"Скрин результата в бот",dur:45,xp:40,tok:1,proof:1},
  {id:"video",name:"Видео",kind:"video",dur:110},
  {id:"lunch",name:"Обед",sub:"Разогреть заготовку",dur:30,xp:15,minor:1,until:"16:00"},
  {id:"gym",name:"Зал",sub:"С дорогой. Веса запиши во вкладке «Зал»",botSub:"С дорогой. Селфи из зала в бот",dur:120,xp:50,tok:1,proof:1,days:[1,2,4,5],train:1},
  {id:"fight",name:"Единоборства",sub:"С дорогой",botSub:"С дорогой. Фото с тренировки в бот",dur:120,xp:50,tok:1,proof:1,days:[3,6],train:1},
  {id:"walk",name:"Прогулка",sub:"День восстановления",dur:45,xp:20,days:[0]},
  {id:"_custom"},

const RANKS=["Рекрут","Крип","Саппорт","Офлейнер","Мидер","Керри","Капитан","Легенда","Титан","Бессмертный"];
const CLEAN_RANKS=[[0,"Рекрут"],[1,"Страж"],[3,"Рыцарь"],[5,"Герой"],[7,"Легенда"],[14,"Властелин"],[21,"Божество"],[30,"Титан"]];
const EXERCISES=["Жим лёжа","Присед","Становая","Жим стоя","Тяга штанги","Подтягивания","Брусья","Жим ногами"];
const IC={
  check:'<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#17110e" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12l5 5 9-10"/></svg>',

  later:'<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12h14M13 6l6 6-6 6"/></svg>',
  back:'<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 5l-7 7 7 7"/></svg>',

};

let state={days:{},body:[],lifts:[]};
let save=()=>{};
let tab="today",confirmPlay=false;

/* ---------- время ---------- */
const pad=n=>String(n).padStart(2,"0");
const fmt=d=>d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate());
const key=()=>fmt(new Date());
const shift=(k,n)=>{const d=new Date(k+"T12:00:00");d.setDate(d.getDate()+n);return fmt(d)};
const dow=k=>new Date(k+"T12:00:00").getDay();
const nowMin=()=>{const n=new Date();return n.getHours()*60+n.getMinutes()};
const toMin=t=>{const[h,m]=String(t).split(":").map(Number);return h*60+m};
const hm=m=>{m=Math.round(m);return pad(Math.floor(m/60)%24)+":"+pad(((m%60)+60)%60)};
const hhmm=()=>hm(nowMin());
const durTxt=m=>m>=60?(Math.floor(m/60)+" ч"+(m%60?" "+(m%60)+" мин":"")):m+" мин";
const esc=s=>String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const $=id=>document.getElementById(id);

/* ---------- данные ---------- */
function norm(s){if(!s||typeof s!=="object")s={};if(!s.days||typeof s.days!=="object")s.days={};if(!Array.isArray(s.body))s.body=[];if(!Array.isArray(s.lifts))s.lifts=[];return s}
function dayOf(k){const d=state.days[k]||(state.days[k]={});d.done=d.done||[];d.at=d.at||{};d.custom=d.custom||[];d.skip=d.skip||[];d.dur=d.dur||{};d.gl=d.gl||[];return d}
const peek=k=>state.days[k];
const has=(d,id)=>!!d&&(d.done||[]).includes(id);
const bossDone=d=>!!d&&BOSS_IDS.every(b=>has(d,b));
const trainOf=k=>{const w=dow(k);return w===0?null:([3,6].includes(w)?"fight":"gym")};
const subOf=q=>BOT&&q.botSub?q.botSub:(q.sub||"");
const locked=q=>BOT&&q.proof;

function queue(k){
  const d=dayOf(k),out=[];
  for(const q of QUESTS){
    if(q.days&&!q.days.includes(dow(k)))continue;
    if(q.id==="_custom"){for(const c of d.custom)out.push({id:c.id,name:c.name,dur:c.dur||30,fixed:c.at||null,xp:15,custom:1});continue}
    if(q.id==="vid2"&&!bossDone(d))continue;
    if(d.skip.includes(q.id))continue;
    if(q.until&&k===key()&&nowMin()>toMin(q.until)&&!has(d,q.id))continue; // утро прошло: не тащим завтрак в вечер
    out.push(q);
  }
  return out;
}
const isDone=(d,q)=>q.kind==="video"?bossDone(d):has(d,q.id);
function durOf(d,q){
  if(d.dur[q.id])return d.dur[q.id];
  if(q.kind==="video"){const left=BOSS_IDS.filter(b=>!has(d,b)).length;return Math.max(20,Math.round(q.dur*left/5))}
  return q.dur||30;
}

/* ---------- живой план ---------- */
// Раскладывает несделанное от «сейчас»: якоря стоят на месте, остальное обтекает их.
function plan(k,extraGame){
  const d=dayOf(k),now=nowMin(),out=[],over=[];
  const start=d.at.wake?Math.min(now,toMin(d.at.wake)):Math.max(now,toMin(DAY_START));
  let cur=Math.max(now,start);
  // идущие катки
  const games=(d.gl||[]).map(toMin).filter(g=>g+GAME_MIN>now).sort((a,b)=>a-b);
  if(extraGame)games.push(Math.max(now,games.length?games[games.length-1]+GAME_MIN:now));
  for(const g of games){const s=g<=now?g:Math.max(g,cur);out.push({game:1,start:s,end:s+GAME_MIN,now:s<=now});cur=Math.max(cur,s+GAME_MIN)}
  const pending=queue(k).filter(q=>!isDone(d,q));
  // начатое дело идёт первым
  const ci=d.cur&&pending.findIndex(q=>q.id===d.cur.id);
  if(ci>=0){const q=pending.splice(ci,1)[0];const s=toMin(d.cur.at);const e=s+durOf(d,q);out.push({q,start:s,end:Math.max(e,now+5),pe:e,started:1,late:now>e?now-e:0,now:1});cur=Math.max(cur,Math.max(e,now+5))}
  const anchors=pending.filter(q=>q.fixed).sort((a,b)=>toMin(a.fixed)-toMin(b.fixed));
  const flex=pending.filter(q=>!q.fixed);
  const end=toMin(DAY_END);
  const placeAnchor=a=>{const s=Math.max(toMin(a.fixed),cur);if(toMin(a.fixed)>cur&&toMin(a.fixed)-cur>=10)out.push({gap:1,start:cur,end:toMin(a.fixed)});out.push({q:a,start:s,end:s+durOf(d,a),anchor:1,late:Math.max(0,cur-toMin(a.fixed))});cur=s+durOf(d,a)};
  for(const q of flex){
    const du=durOf(d,q);
    while(anchors.length&&toMin(anchors[0].fixed)<cur+du&&anchors[0].fixed!==DAY_END)placeAnchor(anchors.shift());
    if(cur+du>end){over.push({q,dur:du});continue}
    out.push({q,start:cur,end:cur+du});cur+=du;
  }
  while(anchors.length)placeAnchor(anchors.shift());
  if(out.length&&!out[0].now&&out[0].start<=now+1)out[0].now=1;
  return {items:out,over};
}

/* ---------- чистое утро, жетоны, XP ---------- */
function cleanState(k){
  const d=peek(k);if(!d)return "pending";
  const at=d.at||{},fs=d.firstSmoke,tr=trainOf(k),tTr=tr?at[tr]:null,tV=at.b5;
  const before=(a,b)=>!!a&&(!b||a<=b);
  if(before(tV,fs)&&(!tr||before(tTr,fs)))return "gold";
  if(tr?before(tTr,fs):before(tV,fs))return "base";
  return fs?"broken":"pending";
}
function cleanStreak(){let n=0,k=key();if(!["base","gold"].includes(cleanState(k)))k=shift(k,-1);
  for(let i=0;i<400;i++){if(["base","gold"].includes(cleanState(k))){n++;k=shift(k,-1)}else break}return n}
const cleanRank=n=>{let r=CLEAN_RANKS[0];for(const x of CLEAN_RANKS)if(n>=x[0])r=x;return r};
const nextClean=n=>CLEAN_RANKS.find(x=>x[0]>n);
// Дота открывается только после видео. Не обязательна: неиспользованные катки в конце дня = +10 XP каждая.
function tokens(d){if(!bossDone(d))return 0;let n=2+["cbr","gym","fight","eng"].filter(id=>has(d,id)).length;if(has(d,"vid2"))n+=2;return n}
const gamesUsed=d=>Math.max(d.games||0,(d.gl||[]).length);
const missedYesterday=k=>{const p=peek(shift(k,-1));return !!p&&(p.done||[]).length>0&&!bossDone(p)};
function dayXP(k){const d=peek(k);if(!d)return 0;let x=0;
  for(const q of QUESTS)if(q.xp&&has(d,q.id))x+=q.xp;
  for(const c of d.custom||[])if(has(d,c.id))x+=15;
  for(const b of BOSS_IDS)if(has(d,b))x+=10;
  if(bossDone(d))x+=(missedYesterday(k)?300:150)-50;
  const c=cleanState(k);if(c==="base")x+=30;if(c==="gold")x+=60;
  if(k<key())x+=10*Math.max(0,tokens(d)-gamesUsed(d));return x}
const totalXP=()=>Object.keys(state.days).reduce((a,k)=>a+dayXP(k),0);
const vids=()=>Object.values(state.days).reduce((a,d)=>a+(bossDone(d)?1:0)+(has(d,"vid2")?1:0),0);
function videoStreak(){let n=0,k=key();if(!bossDone(peek(k)))k=shift(k,-1);while(bossDone(peek(k))){n++;k=shift(k,-1)}return n}
const countQ=(ids,days)=>{let n=0;const keys=days?Array.from({length:days},(_,i)=>shift(key(),-i)):Object.keys(state.days);for(const k of keys){const d=peek(k);if(d&&ids.some(id=>has(d,id)))n++}return n};
const e1rm=l=>l.kg*(1+(l.reps||1)/30);
const liftsOf=ex=>state.lifts.filter(l=>l.ex===ex);

const ACH=[
  {t:"Первая кровь",d:"Первое видео",ok:()=>vids()>=1},
  {t:"Тройной",d:"3 дня подряд с видео",ok:()=>videoStreak()>=3},
  {t:"Неделя без пропусков",d:"7 дней с видео",ok:()=>videoStreak()>=7},
  {t:"Дубль",d:"Два видео за день",ok:()=>countQ(["vid2"])>=1},
  {t:"Сила воли",d:"День с видео и без Доты",ok:()=>Object.keys(state.days).some(k=>k<key()&&bossDone(peek(k))&&!gamesUsed(peek(k)))},
  {t:"Десятка",d:"10 видео",ok:()=>vids()>=10},
  {t:"Канал живой",d:"30 видео",ok:()=>vids()>=30},
  {t:"Ясная голова",d:"3 чистых дня подряд",ok:()=>cleanStreak()>=3},
  {t:"Золотой день",d:"Чисто до видео и зала",ok:()=>Object.keys(state.days).some(k=>cleanState(k)==="gold")},
  {t:"Железо",d:"8 тренировок",ok:()=>countQ(["gym","fight"])>=8},
  {t:"Рекорд",d:"Побить свой вес в упражнении",ok:()=>EXERCISES.concat([...new Set(state.lifts.map(l=>l.ex))]).some(ex=>{const L=liftsOf(ex);return L.length>1&&e1rm(L[L.length-1])>Math.max(...L.slice(0,-1).map(e1rm))})},
  {t:"Почти водитель",d:"CBR 10 дней",ok:()=>countQ(["cbr"])>=10},
  {t:"Speak up",d:"Английский 10 дней",ok:()=>countQ(["eng"])>=10}
];
const achSet=()=>new Set(ACH.filter(a=>a.ok()).map(a=>a.t));

function toast(t){const el=$("toast");el.textContent=t;el.classList.add("show");clearTimeout(toast.h);toast.h=setTimeout(()=>el.classList.remove("show"),2600)}
function haptic(t){try{window.Telegram&&Telegram.WebApp.HapticFeedback.notificationOccurred(t)}catch(e){}}

function mutate(fn){
  const k=key(),before=achSet(),wasBoss=bossDone(peek(k)),wasClean=cleanState(k);
  fn();
  const d=peek(k);let delay=0;
  if(!wasBoss&&bossDone(d)){toast("Видео вышло. Дота открыта. Играть не обязательно: катка, что не сыграл, = +10 XP.");haptic("success");delay=2700}
  const c=cleanState(k);
  if(c!==wasClean&&(c==="base"||c==="gold"))setTimeout(()=>toast(c==="gold"?"Золотой день. +60 XP":"Чистое утро засчитано. +30 XP"),delay);
  const got=ACH.filter(a=>a.ok()&&!before.has(a.t));if(got.length)setTimeout(()=>toast("Ачивка: "+got[0].t),delay+2700);
  render();save();
}
function findQ(id){return QUESTS.find(x=>x.id===id)||VIDEO_STEPS.find(x=>x.id===id)||dayOf(key()).custom.find(c=>c.id===id)}
function toggle(id){
  const q=findQ(id),d=dayOf(key());
  if(q&&locked(q)&&!has(d,id)){toast("Это закрывается пруфом. Кинь его боту.");haptic("warning");return}
  mutate(()=>{const i=d.done.indexOf(id);
    if(i>=0){if(q&&locked(q))return;d.done.splice(i,1);delete d.at[id]}
    else{d.done.push(id);d.at[id]=hhmm();if(d.cur&&(d.cur.id===id||(d.cur.id==="video"&&bossDone(d))))delete d.cur}});
}
function startTask(id){const d=dayOf(key());mutate(()=>{d.cur={id,at:hhmm()}});const q=findQ(id);if(q)toast("Начал: "+q.name+". Остальное сдвинулось")}
const nextStep=d=>VIDEO_STEPS.find(s=>!has(d,s.id));

/* ---------- отрисовка ---------- */
function renderReward(){
  const d=dayOf(key()),earned=tokens(d),used=Math.min(gamesUsed(d),earned),left=earned-used,slots=bossDone(d)?7:5;
  let pips="";for(let i=0;i<slots;i++){const cls=i<used?"used":(i<earned?"on":"");pips+=`<div class="pip${i>=5?" bonus":""}${cls?" "+cls:""}"></div>`}
  const lbl=!bossDone(d)?"Дота закрыта до видео":`Дота: ${left} ${left===1?"катка":left>1&&left<5?"катки":"каток"}`;
  $("reward").innerHTML=`${IC.chest}<span class="lbl">${lbl}</span>
    <div class="pips" style="grid-template-columns:repeat(${slots},minmax(0,1fr))">${pips}</div>
    <button type="button" class="playbtn" id="play" ${left>0?"":"disabled"}>Сыграть</button>`;
  $("play").onclick=()=>{confirmPlay=true;render();window.scrollTo(0,0)};
  if(!confirmPlay||left<=0){$("confirm").innerHTML="";return}
  const k=key(),a=plan(k),b=plan(k,true);
  const nextReal=b.items.find(x=>x.q&&!x.started);
  const newly=b.over.filter(o=>!a.over.some(x=>x.q.id===o.q.id));
  $("confirm").innerHTML=`<section class="confirm"><b style="font-size:16px">Катка сейчас: ${hhmm()}–${hm(nowMin()+GAME_MIN)}</b>
    <p>${nextReal?`Дальше всё сдвинется на ${GAME_MIN} минут. «${esc(nextReal.q.name)}» начнётся в ${hm(nextReal.start)}.`:"После катки дел не осталось."}</p>
    ${newly.length?`<p class="warn">Не влезет до отбоя: ${newly.map(o=>esc(o.q.name)).join(", ")}.</p>`:""}
    <div class="btns"><button type="button" id="nogame">Не сейчас</button><button type="button" class="pri" id="gogame">Играю</button></div></section>`;
  $("nogame").onclick=()=>{confirmPlay=false;render()};
  $("gogame").onclick=()=>{confirmPlay=false;mutate(()=>{d.gl.push(hhmm());d.games=gamesUsed(d)});toast("GL HF. Катка 45 минут.")};
}
function renderHead(){
  const xp=totalXP(),lvl=Math.floor(xp/300)+1;
  $("day").textContent=new Date().toLocaleDateString("ru-RU",{weekday:"long"});
  $("lvl").textContent=`Ур. ${lvl} ${RANKS[Math.min(lvl-1,RANKS.length-1)]} · ${xp%300}/300 XP${videoStreak()?" · серия "+videoStreak():""}`;
  // полоса дня: от сейчас до отбоя
  const now=nowMin(),bed=toMin("23:30"),span=Math.max(1,bed-now),p=plan(key());
  const free=p.items.filter(i=>i.gap).reduce((a,i)=>a+Math.max(0,i.end-Math.max(i.start,now)),0),miss=p.over.reduce((a,o)=>a+o.dur,0);
  let segs="",total=0;
  for(const i of p.items){const st=Math.max(i.start,now),en=Math.min(i.end,bed);if(en<=st)continue;const w=(en-st)/span*100;total+=en-st;
    const c=i.gap?"f":i.game?"g":i.q&&i.q.kind==="video"?"v":i.anchor?"a":"t";segs+=`<i class="${c}" style="width:${w.toFixed(2)}%" title="${esc(i.gap?"Свободно":i.game?"Катка":i.q.name)}"></i>`}
  if(miss)segs+=`<i class="o" style="width:${Math.min(30,miss/span*100).toFixed(2)}%"></i>`;
  $("daybar").innerHTML=`<div class="track" role="img" aria-label="План до отбоя">${segs}</div>
    <div class="dline">${miss?`<span class="minus">Не хватает <b>${durTxt(miss)}</b></span>`:`<span class="free">Свободно <b>${durTxt(free)}</b></span>`}<span>До отбоя <b>${durTxt(Math.max(0,bed-now))}</b></span></div>`;

}
function nowCard(k,d,p){
  const it=p.items[0],now=nowMin();
  if(!it)return `<section class="now free"><span class="k">День закрыт</span><h2>Всё сделано</h2><p>Свободное время до ${DAY_END}. Потом экран выкл.</p></section>`;
  if(it.gap)return `<section class="now free"><span class="k"><span>Свободно</span><span>до ${hm(it.end)}</span></span><h2>${durTxt(it.end-now)} свободно</h2><p>Следом: «${esc((p.items[1]&&p.items[1].q||{}).name||"")}». Можно катку или отдохнуть.</p></section>`;
  if(it.game){const left=it.end-now;return `<section class="now free"><span class="k"><span>Катка</span><span>до ${hm(it.end)}</span></span><div class="clock"><b>${left}</b><span>мин осталось</span></div><p>Потом: «${esc((p.items[1]&&p.items[1].q||{}).name||"дел нет")}» в ${p.items[1]?hm(p.items[1].start):""}.</p></section>`}
  const q=it.q,late=it.late>0,left=it.end-now;
  const kline=`<span class="k"><span>${it.started?"Сейчас":"Начать сейчас"}</span><span>${late?"план был до "+hm(it.pe):"до "+hm(it.end)}</span></span>`;
  const clock=it.started?`<div class="clock"><b>${late?"+"+it.late:left}</b><span>${late?"мин сверх плана":"мин осталось"}</span></div>`:`<div class="clock"><b>${hm(it.start)}–${hm(it.end)}</b></div>`;
  if(q.kind==="video"){
    const st=nextStep(d),i=VIDEO_STEPS.indexOf(st);
    const segs=VIDEO_STEPS.map(s=>`<div class="seg${has(d,s.id)?" on":""}"></div>`).join("");
    const step=locked(st)?`<button type="button" class="ghost" data-proof="1">Кинуть ссылку боту</button>`:`<button type="button" class="ghost" data-t="${st.id}">Шаг сделан</button>`;
    return `<section class="now${late?" late":""}">${kline}<div><h2>Видео: ${esc(st.name.split(" ")[0].toLowerCase())}</h2><p>Шаг ${i+1} из 5. ${esc(BOT&&st.botHint?st.botHint:st.hint)}</p></div>${clock}<div class="segs">${segs}</div>
      <button type="button" class="bigbtn" data-focus="1">${IC.play}${it.started?"Открыть фокус":"Начать фокус 50 минут"}</button>${step}</section>`;
  }

  const startB=it.started?"":`<button type="button" class="ghost" data-start="${esc(q.id)}">Начать, засечь время</button>`;

function viewGym(){

function viewProg(){

  if(t.dataset.del){mutate(()=>{d.custom=d.custom.filter(c=>c.id!==t.dataset.del);d.done=d.done.filter(x=>x!==t.dataset.del);(d.del=d.del||[]).push(t.dataset.del)});return}
  if(t.dataset.later){const c=d.custom.find(c=>c.id===t.dataset.later);if(!c)return;mutate(()=>{d.custom=d.custom.filter(x=>x!==c);(d.del=d.del||[]).push(c.id);dayOf(shift(key(),1)).custom.push(c)});toast("Перенёс на завтра");return}
  if(t.dataset.delon){const[kk,id]=t.dataset.delon.split("|"),dt=dayOf(kk);mutate(()=>{dt.custom=dt.custom.filter(c=>c.id!==id);(dt.del=dt.del||[]).push(id)});return}

document.addEventListener("submit",e=>{

      <button type="button" class="goldbtn" data-w="next">Дальше</button>`;
  if(W.step==="dur")body=`<h2>Сколько займёт?</h2><p class="q">${esc(W.name)}, ${esc(wDate())}${W.at&&W.at!=="pick"?" в "+esc(W.at):""}</p><div class="opts three">
      ${[15,30,45,60,90,120].map(m=>`<button type="button" class="opt" data-w="dur:${m}" ${pr(W.dur,m)}>${durTxt(m)}</button>`).join("")}</div>
      <button type="button" class="goldbtn" data-w="save">Добавить в план</button>`;
  if(W.step==="weight")body=`<h2>Вес тела</h2><form data-wf="weight"><input name="v" inputmode="decimal" placeholder="82.5" aria-label="Вес, кг" autocomplete="off"></form><button type="button" class="goldbtn" data-w="saveweight">Записать</button>`;
  if(W.step==="lift")body=`<h2>Подход в зале</h2><form data-wf="lift" style="display:flex;flex-direction:column;gap:8px"><input name="ex" list="exlist2" placeholder="Упражнение" aria-label="Упражнение" autocomplete="off">
      <datalist id="exlist2">${[...new Set(EXERCISES.concat(state.lifts.map(l=>l.ex).filter(Boolean)))].map(e=>`<option value="${esc(e)}">`).join("")}</datalist>
      <div style="display:flex;gap:8px"><input name="kg" inputmode="decimal" placeholder="Вес, кг" aria-label="Вес, кг"><input name="reps" inputmode="numeric" placeholder="Повторы" aria-label="Повторы"></div></form>
      <button type="button" class="goldbtn" data-w="savelift">Записать</button>`;
  el.innerHTML=`<div class="pnl" role="dialog" aria-modal="true" aria-label="Добавить">${top}${body}</div>`;
  const inp=el.querySelector("input[name=v]");if(inp)setTimeout(()=>inp.focus(),50);
}
function wNext(){
  if(W.step==="name"){const v=$("sheet").querySelector("input[name=v]").value.trim();if(!v){toast("Напиши, что за дело");return}W.name=v.slice(0,80);W.step="when"}
  else if(W.step==="when"){const dv=$("wdate")&&$("wdate").value;if(dv)W.date=dv;W.step="time"}
  else if(W.step==="time"){if(W.at!==""){const tv=$("wtime")&&$("wtime").value;if(!tv){toast("Выбери время");return}W.at=tv}W.step="dur"}
  renderSheet();
}
$("sheet").addEventListener("click",e=>{
  if(e.target===$("sheet")){closeSheet();return}
  const b=e.target.closest("[data-w]");if(!b)return;e.stopPropagation();const a=b.dataset.w;
  if(a==="close")return closeSheet();
  if(a==="back"){const i=STEPS.indexOf(W.step);W.step=i>0?STEPS[i-1]:"menu";return renderSheet()}
  if(a==="next")return wNext();
  if(a.startsWith("go:")){W.step=a.slice(3);return renderSheet()}
  if(a.startsWith("date:")){W.date=a.slice(5);W.step="time";return renderSheet()}
  if(a.startsWith("at:")){const v=a.slice(3);if(v===""){W.at="";W.step="dur"}else W.at="pick";return renderSheet()}
  if(a.startsWith("dur:")){W.dur=+a.slice(4);return renderSheet()}
  if(a==="save"){const c={id:"c"+Date.now().toString(36),name:W.name,dur:W.dur};if(W.at&&W.at!=="pick")c.at=W.at;const dd=dayOf(W.date),when=wDate();
    closeSheet();mutate(()=>dd.custom.push(c));toast(`Добавил на ${when}${c.at?" в "+c.at:""}. План пересчитан`);return}
  if(a==="saveweight"){const kg=parseFloat($("sheet").querySelector("input[name=v]").value.replace(",","."));if(!(kg>30&&kg<250)){toast("Напиши вес числом, например 82.5");return}
    closeSheet();mutate(()=>{state.body=state.body.filter(x=>x.d!==key());state.body.push({d:key(),kg:Math.round(kg*10)/10})});toast("Вес записан");return}
  if(a==="savelift"){const f=$("sheet").querySelector("form"),ex=f.ex.value.trim(),kg=parseFloat(f.kg.value.replace(",",".")),reps=parseInt(f.reps.value,10);
    if(!ex||!(kg>=0)||!(reps>0)){toast("Заполни упражнение, вес и повторы");return}
    const L=liftsOf(ex),prev=L.length?Math.max(...L.map(e1rm)):0;closeSheet();
    mutate(()=>state.lifts.push({d:key(),ex:ex.slice(0,40),kg:Math.round(kg*10)/10,reps,clean:!dayOf(key()).firstSmoke}));toast(L.length&&kg*(1+reps/30)>prev?"Новый рекорд в «"+ex+"»":"Подход записан");return}
});
$("sheet").addEventListener("submit",e=>{e.preventDefault();e.stopPropagation();const f=e.target.dataset.wf;if(f==="name")wNext();if(f==="weight")$("sheet").querySelector("[data-w=saveweight]").click()});
$("plus").onclick=openSheet;
document.addEventListener("keydown",e=>{if(e.key==="Escape"&&W)closeSheet()});

/* ---------- фокус ---------- */
const WORK=50*60,BREAK=10*60;
let F={phase:"work",endsAt:0,left:WORK,running:false,session:1},tick=null;
function loadF(){try{const v=JSON.parse(localStorage.getItem("qd-focus")||"null");if(v&&v.day===key())F=Object.assign(F,v)}catch(e){}}
function saveF(){try{localStorage.setItem("qd-focus",JSON.stringify(Object.assign({day:key()},F)))}catch(e){}}
const remain=()=>F.running?Math.max(0,Math.round((F.endsAt-Date.now())/1000)):F.left;
function openFocus(){loadF();const d=dayOf(key());
  if(!d.cur||d.cur.id!=="video")mutate(()=>{d.cur={id:"video",at:hhmm()}});
  if(!F.running&&F.left===WORK&&F.phase==="work"){F.running=true;F.endsAt=Date.now()+WORK*1000}
  saveF();$("focus").hidden=false;document.body.style.overflow="hidden";renderFocus();clearInterval(tick);tick=setInterval(stepTimer,1000)}
function closeFocus(){$("focus").hidden=true;document.body.style.overflow="";clearInterval(tick);render()}
function stepTimer(){
  if(F.running&&remain()<=0){
    if(F.phase==="work"){F.phase="break";F.endsAt=Date.now()+BREAK*1000;toast("50 минут есть. Перерыв 10 минут, без Доты.");haptic("success")}
    else{F.phase="work";F.session++;F.endsAt=Date.now()+WORK*1000;toast("Перерыв всё. Сессия "+F.session+".");haptic("warning")}
    saveF();}
  renderFocus(true);
}
function renderFocus(onlyTime){
  const s=remain(),mm=pad(Math.floor(s/60)),ss=pad(s%60),tot=F.phase==="work"?WORK:BREAK,C=2*Math.PI*104,off=C*(1-s/tot);
  if(onlyTime&&$("ftime")){$("ftime").textContent=mm+":"+ss;$("farc").setAttribute("stroke-dashoffset",off.toFixed(1));return}
  const d=dayOf(key()),st=nextStep(d);
  const list=VIDEO_STEPS.map(x=>`<div class="${has(d,x.id)?"done":x===st?"cur":""}"><span class="dot">${has(d,x.id)?IC.check:""}</span>${esc(x.name)}</div>`).join("");
  const main=!st?`<button type="button" class="goldbtn" id="fclose2">Видео вышло. Закрыть</button>`:locked(st)?`<button type="button" class="goldbtn" data-proof="1">Кинуть ссылку боту</button>`:`<button type="button" class="goldbtn" data-t="${st.id}">Готово, следующий шаг</button>`;
  $("focus").innerHTML=`<div class="top"><button type="button" class="back" id="fclose" aria-label="Назад">${IC.back}</button><span style="font-size:14px;font-weight:800;color:var(--muted)">${F.phase==="work"?"Сессия "+F.session:"Перерыв"}</span><span style="width:44px"></span></div>
    <div class="ring"><svg width="240" height="240" viewBox="0 0 240 240" role="img" aria-label="Осталось ${mm} минут"><circle cx="120" cy="120" r="104" fill="none" stroke="#2a1d16" stroke-width="12"/><circle id="farc" cx="120" cy="120" r="104" fill="none" stroke="${F.phase==="work"?"#e5603f":"#6c9a7d"}" stroke-width="12" stroke-linecap="round" stroke-dasharray="${C.toFixed(1)}" stroke-dashoffset="${off.toFixed(1)}" transform="rotate(-90 120 120)"/></svg>
      <div class="c"><b id="ftime">${mm}:${ss}</b><span>${F.phase==="work"?(F.running?"до перерыва":"на паузе"):"отдых"}</span></div></div>
    <div class="fstep"><h2>${st?esc(st.name):"Видео готово"}</h2><p>${st?esc(BOT&&st.botHint?st.botHint:st.hint):"Красавчик. Дота открыта, если хочешь."}</p></div>
    <div class="flist">${list}</div>
    <div class="factions"><span class="tip">Телефон экраном вниз. Дота подождёт до загрузки.</span>${main}<button type="button" class="line" id="fpause">${F.running?"Пауза":"Продолжить"}</button></div>`;
  $("fclose").onclick=closeFocus;if($("fclose2"))$("fclose2").onclick=closeFocus;
  $("fpause").onclick=()=>{if(F.running){F.left=remain();F.running=false}else{F.running=true;F.endsAt=Date.now()+F.left*1000}saveF();renderFocus()};
}

/* ---------- пересчёт раз в минуту ---------- */
setInterval(()=>{if($("focus").hidden&&!W&&!document.querySelector("form.add input:focus"))render()},60000);

/*STORAGE: Telegram Mini App, данные в базе бота*/
const tg=window.Telegram&&Telegram.WebApp;
if(tg){try{tg.ready();tg.expand();tg.setHeaderColor("#2a1a12");tg.setBackgroundColor("#17110e")}catch(e){}}
const hdr=()=>({"Content-Type":"application/json","X-Init-Data":tg?tg.initData:""});
async function pull(){
  try{const r=await fetch("api/state",{headers:hdr()});if(!r.ok)throw new Error(r.status);
    state=norm(await r.json());render()}
  catch(e){toast("Нет связи с ботом. Открой квест кнопкой в боте.")}
}
let st;
save=()=>{clearTimeout(st);st=setTimeout(async()=>{
  try{const r=await fetch("api/state",{method:"POST",headers:hdr(),body:JSON.stringify(state)});
    if(r.ok){state=norm(await r.json());render()}}catch(e){}},500)};
render();pull();
document.addEventListener("visibilitychange",()=>{if(!document.hidden)pull()});
if(tg)tg.onEvent("activated",pull);
/*END STORAGE*/
</script>

</body></html>
